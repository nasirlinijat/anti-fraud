name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still in progress for it.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: backend-tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: antifraud
          POSTGRES_PASSWORD: antifraud
          POSTGRES_DB: antifraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antifraud -d antifraud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://antifraud:antifraud@localhost:5432/antifraud?sslmode=disable
      TEST_RUNTIME_DATABASE_URL: postgres://antifraud_api:ci-runtime-password@localhost:5432/antifraud?sslmode=disable
      TEST_LABELS_DATABASE_URL: postgres://antifraud_labels:ci-labels-password@localhost:5432/antifraud?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        if: matrix.shard == 'core'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        if: matrix.shard == 'core'
        run: go vet ./...

      - name: Migrate
        run: >-
          docker run --rm --network host
          -v "$PWD/migrations:/migrations:ro"
          migrate/migrate:v4.20.1
          -path=/migrations -database "$TEST_DATABASE_URL" up

      - name: Provision API database role
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=antifraud -e RUNTIME_DB_PASSWORD=ci-runtime-password -e LABELS_DB_PASSWORD=ci-labels-password
          -v "$PWD/runtime-role.sql:/runtime-role.sql:ro"
          postgres:18-alpine
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U antifraud -d antifraud -f /runtime-role.sql

      - name: Test CI coverage helper
        if: matrix.shard == 'core'
        working-directory: .
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Test assigned packages
        working-directory: .
        run: >-
          python3 scripts/ci/backend_checks.py run --shard '${{ matrix.shard }}'
          --output-dir '${{ runner.temp }}/backend-coverage/${{ matrix.shard }}'

      - name: Verify modules
        if: matrix.shard == 'core'
        run: go mod verify

      - name: Build
        if: matrix.shard == 'core'
        run: go build ./...

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-coverage/${{ matrix.shard }}/
          if-no-files-found: error

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ""
      TEST_RUNTIME_DATABASE_URL: ""
      TEST_LABELS_DATABASE_URL: ""
      TEST_REDIS_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Integration, concurrency and reset tests
        run: go test -race -count=1 -p 1 -tags=integration ./test/...

  backend:
    name: backend
    needs: [backend-tests, backend-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage-core
          path: ${{ runner.temp }}/coverage-core
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage-cpu
          path: ${{ runner.temp }}/coverage-cpu
      - name: Validate prerequisites and combine coverage
        env:
          BACKEND_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/ci/backend_checks.py merge
          --core '${{ runner.temp }}/coverage-core'
          --cpu '${{ runner.temp }}/coverage-cpu'
          --output-dir backend
          --needs-json "$BACKEND_NEEDS"
      - name: Coverage
        working-directory: backend
        run: |
          go tool cover -func=coverage.txt > coverage-by-function.txt
          go tool cover -html=coverage.txt -o coverage.html
          total="$(tail -1 coverage-by-function.txt | awk '{print $NF}')"
          echo "Backend unit test coverage: $total"
          echo "### Backend coverage: $total" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          if-no-files-found: error
          path: |
            backend/coverage.txt
            backend/coverage-by-function.txt
            backend/coverage.html

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the code and history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --verbose

  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Known vulnerabilities in Go and modules
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Code security checks
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -exclude=G101,G115,G118,G404 ./...

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          tags: anti-fraud-backend:ci
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend

      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL --no-progress anti-fraud-backend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.76.1 image --severity CRITICAL --exit-code 1 --no-progress anti-fraud-backend:ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint and type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser checks
        run: npm run test:browser -- --project=chromium

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          pip freeze --exclude pip > "$RUNNER_TEMP/ml-installed.txt"
          pip install pip-audit==2.10.1
          pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/ml-installed.txt"

      # The tests use synthetic purchases and the exported golden rows, never
      # the IEEE-CIS dataset, which is not in the repository.
      - name: Test
        run: python -m pytest tests
