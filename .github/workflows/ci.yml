name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still in progress for it.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: antifraud
          POSTGRES_PASSWORD: antifraud
          POSTGRES_DB: antifraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antifraud -d antifraud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://antifraud:antifraud@localhost:5432/antifraud?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated code
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff

      - name: Vet
        run: go vet ./...

      - name: Migrate
        run: >-
          docker run --rm --network host
          -v "$PWD/migrations:/migrations:ro"
          migrate/migrate:v4.20.1
          -path=/migrations -database "$TEST_DATABASE_URL" up

      - name: Test
        run: go test -race ./...

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and type check
        run: npm run check

      - name: Build
        run: npm run build

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # The tests use synthetic purchases and the exported golden rows, never
      # the IEEE-CIS dataset, which is not in the repository.
      - name: Test
        run: python -m pytest tests
