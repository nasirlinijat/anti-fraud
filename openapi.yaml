openapi: 3.0.3

info:
  title: Anti-Fraud API
  version: 0.1.0
  description: |
    Real-time fraud scoring for in-game purchases. Every purchase gets one of
    three outcomes: `allow`, `review`, or `block`.

    This file is written by hand and is the agreed format for the score
    request and response. The backend, the simulator, the frontend, and the
    conversion of the IEEE-CIS data all use these fields.

    Conventions:

    - Amounts are integers in minor units, never decimals.
    - Times are RFC 3339 and are converted to UTC. The response and the
      stored data use UTC.
    - Optional fields can be omitted. A rule that needs an omitted field does
      not fire.

servers:
  - url: http://localhost:8080
    description: Local development server.

tags:
  - name: Auth
    description: Sign reviewers and admins in and out.
  - name: Simulations
    description: Control simulation runs when explicitly enabled.
  - name: Score
    description: Score a purchase and read saved decision status.
  - name: Health
    description: Check that the service runs and can score purchases.
  - name: Account events
    description: Record the logins and password resets that the game's account system reports.
  - name: Chargebacks
    description: Receive chargebacks from the payment processor.
  - name: Stats
    description: Decision statistics for the dashboard.
  - name: Blocklist
    description: Manage blocked cards, devices, players and IP addresses.
  - name: Reviews
    description: Browse purchases awaiting review.
  - name: Admin
    description: Oversee reviewers. Admin sessions only.

  - name: Rulesets
    description: Read and publish scoring configuration.

paths:
  /decision-status:
    get:
      tags: [Score]
      summary: Read the original scoring outcome and final review status
      description: >-
        Read saved data for one exact transaction ID. The outcome is the immutable
        original scoring outcome. This deployment uses one service key, without
        per-merchant ownership isolation. No payment or item delivery is performed.
        Poll pending reviews every 5 seconds and honor Retry-After on 429/503.
        A missing purchase or temporary error never grants permission to fulfill.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: transaction_id
          required: true
          description: >-
            Exactly one URL-encoded transaction ID, trimmed like POST /score.
            Case-sensitive; do not apply the console search length limit.
            Malformed encoding, invalid text and repeated values return 400.
            The server request-header/URI size limit still applies.
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Saved scoring outcome and committed review state
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transaction_id, outcome, review_status, resolved_at]
                properties:
                  transaction_id: {type: string}
                  outcome: {type: string, enum: [allow, review, block]}
                  review_status:
                    type: string
                    enum: [not_required, pending, approved, rejected]
                    description: not_required for allow/block; otherwise the saved review state.
                  resolved_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Saved UTC resolution time; null for pending or not_required.
        "400":
          description: Invalid or repeated transaction_id or malformed query encoding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401":
          description: Missing, wrong or duplicate service key; console sessions do not authorize this operation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: No saved scored purchase has this transaction ID
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429":
          description: Status polling rate exceeded; its bucket is separate from scoring
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds before retrying}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "503":
          description: Database unavailable or the lookup deadline passed
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds before retrying}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with a username and password
      description: >-
        Starts a session that lasts 12 hours. Send the returned token as
        `Authorization: Bearer <token>`. The username is not case-sensitive.
        After 5 sign-in attempts for a username within 15 minutes, further
        attempts are rejected until the 15 minutes have passed. A successful
        sign-in resets the count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The body is not a single sign-in object, or the username or password is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The username or password is wrong, or the account is disabled. All
            three return the same message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The body is larger than 1024 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The username has no sign-in attempts left.
          headers:
            Retry-After:
              description: Seconds until the username may sign in again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The sign-in could not be checked or saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getSignedInAccount
      summary: Get the signed-in account
      security:
        - SessionAuth: []
      responses:
        "200":
          description: The account of the session.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "500":
          description: The session could not be checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      description: The token stops working immediately. Other sessions of the account stay signed in.
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/SessionRequired"
        "500":
          description: The session could not be ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /simulations/reset:
    post:
      tags: [Simulations]
      operationId: resetDemoData
      summary: Reset the demonstration database
      description: |
        Available only when SIMULATION_ENABLED=true. Pause external ingestion
        and finish in-flight work first. Clears all purchases, decisions,
        reviews, evaluation data, feature totals, blocklist entries, account
        events, and simulation history, including request IDs. Preserves
        rulesets, console accounts, sessions, and configuration audit records.
        Requires an admin session . Active console runs conflict.
      security: [{SessionAuth: []}]
      responses:
        '204': {description: Demo data reset. Repeating an empty reset is safe.}
        '401': {description: Missing or invalid session.}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '404': {description: Simulation feature disabled.}
        '409': {description: A simulation controller or another reset is active.}
        '503': {description: Reset service unavailable or request deadline exceeded.}
  /simulations:
    post:
      tags: [Simulations]
      operationId: startSimulation
      summary: Start a durable simulation run
      description: |
        Available only when SIMULATION_ENABLED=true. Only one console-managed run
        can be starting, running or stopping. Purchases use POST /score.
        A matching request_id for the same operator returns the original run;
        changing its settings returns 409. Runs are interrupted after restart.
      security: [{SessionAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationSettings'}
      responses:
        '202':
          description: Run durably accepted. Location points to its status.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '200':
          description: Matching start retry; the original run is returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '400': {description: Invalid JSON or settings.}
        '401': {description: "The session is missing or invalid."}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '404': {description: Simulation feature disabled.}
        '409': {description: "Active run conflict (includes active_run_id when available), or request_id settings conflict."}
        '503': {description: "Operator access, database or simulation controller unavailable."}
    get:
      tags: [Simulations]
      operationId: listSimulations
      summary: Read simulation history
      security: [{SessionAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: before, description: Previous next_cursor value., schema: {type: string}}
      responses:
        '200':
          description: Runs newest first, with a cursor and available scenario names.
          content:
            application/json:
              schema:
                type: object
                required: [items, available_scenarios]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SimulationRun'}}
                  next_cursor: {type: string}
                  available_scenarios: {type: array, items: {type: string}}
        '400': {description: Invalid cursor or limit.}
        '401': {description: "The session is missing or invalid."}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '404': {description: Simulation feature disabled.}
        '503': {description: Database unavailable.}
  /simulations/{id}:
    get:
      tags: [Simulations]
      operationId: getSimulation
      summary: Read durable simulation progress
      security: [{SessionAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Saved run snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '401': {description: "The session is missing or invalid."}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '404': {description: Unknown run or disabled feature.}
        '503': {description: Database unavailable.}
  /simulations/{id}/stop:
    post:
      tags: [Simulations]
      operationId: stopSimulation
      summary: Stop a simulation after settling its in-flight purchase
      security: [{SessionAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '202':
          description: Stop requested; poll until terminal. Repeated stops are safe.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '200':
          description: Run already terminal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '401': {description: "The session is missing or invalid."}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '404': {description: Unknown run or disabled feature.}
        '503': {description: Operator access or database unavailable.}
  /score:
    post:
      tags: [Score]
      operationId: scorePurchase
      summary: Score a purchase
      description: |
        Scores a purchase, saves the purchase and its decision, and returns the
        outcome.

        1. If the card, player, device, or IP address is on the blocklist, the
           purchase is blocked before the rules run. The score is 0 and no
           rules fire.
        2. Otherwise the enabled rules of the active ruleset add points. A
           total at or above the block threshold is `block`, at or above the
           review threshold is `review`, and anything lower is `allow`.
        3. When a fraud model is loaded, the `model.mode` of the active
           ruleset decides how it is used. `off` computes and saves no model
           score. `shadow` saves the score but leaves the outcome unchanged.
           `assist` clears a `review` with a score below `clear_below` and
           sends an `allow` with a score at or above `flag_at` to review. The
           model never blocks a purchase in any mode.

        Purchases with the outcome `review` go to the review queue for an
        analyst. After authentication and validation, a retry with the same
        transaction ID and matching purchase fields returns the saved decision
        without scoring or saving again. Fields are compared after normal
        request normalization, with timestamps compared at PostgreSQL's
        microsecond precision. A valid request that reuses the ID with
        different fields returns 409.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
            examples:
              minimal:
                summary: Only the required fields.
                value:
                  transaction_id: txn-10042
                  event_time: "2026-11-08T10:00:00Z"
                  amount_minor: 1999
                  player_id: player-381
                  card_token: card-7f3a
              full:
                summary: Every field.
                value:
                  transaction_id: txn-10043
                  event_time: "2026-11-08T14:00:00+04:00"
                  amount_minor: 60000
                  player_id: player-381
                  card_token: card-7f3a
                  card_issuer: "9500"
                  card_network: visa
                  card_type: debit
                  card_country: AZ
                  card_category: "226"
                  product_code: W
                  billing_region: "299"
                  billing_country: "87"
                  billing_distance: 12.5
                  email_domain: gmail.com
                  recipient_email_domain: outlook.com
                  device_type: mobile
                  device_name: SM-G991B
                  device_id: device-55c1
                  ip_address: 203.0.113.9
                  ip_country: TR
                  account_created_at: "2026-11-08T09:00:00Z"
                  client_os: Windows 10
                  client_browser: chrome 63.0
                  screen_resolution: 1920x1080
                  cvv_result: match
                  avs_result: partial
                  three_ds_result: authenticated
      responses:
        "200":
          description: The decision was saved for this purchase or returned from a matching earlier request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
              examples:
                allow:
                  summary: No rule fired.
                  value:
                    transaction_id: txn-10042
                    outcome: allow
                    score: 0
                    fired_rules: []
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
                review:
                  summary: Rules added 60 points, which is above the review threshold of 50.
                  value:
                    transaction_id: txn-10044
                    outcome: review
                    score: 60
                    fired_rules:
                      - name: card_velocity
                        points: 40
                      - name: new_account
                        points: 20
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
                blockedByRules:
                  summary: Rules added 115 points, which is above the block threshold of 80.
                  value:
                    transaction_id: txn-10043
                    outcome: block
                    score: 115
                    fired_rules:
                      - name: high_amount
                        points: 30
                      - name: card_velocity
                        points: 40
                      - name: new_account
                        points: 20
                      - name: country_mismatch
                        points: 25
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
                blockedByBlocklist:
                  summary: A blocklist entry matched, so the rules did not run.
                  value:
                    transaction_id: txn-10045
                    outcome: block
                    score: 0
                    fired_rules: []
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
        "400":
          description: >-
            The request is not valid. When the problem is about specific
            fields, `fields` names each one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidField:
                  summary: A field has a wrong value.
                  value:
                    error: invalid request
                    fields:
                      amount_minor: must be a positive integer in minor units
                missingField:
                  summary: A required field is missing.
                  value:
                    error: invalid request
                    fields:
                      player_id: is required
                unknownField:
                  summary: The body has a field that is not in the request.
                  value:
                    error: invalid request
                    fields:
                      amount: is not a known field
                badTime:
                  summary: A time is not RFC 3339.
                  value:
                    error: times must be RFC 3339, for example 2026-11-08T10:00:00Z
                badJson:
                  summary: The body is not valid JSON.
                  value:
                    error: request body is not valid JSON
        "401":
          description: The `X-API-Key` header is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "409":
          description: This transaction ID belongs to a saved purchase with different fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: a purchase with this transaction ID was already scored
                fields:
                  transaction_id: is already scored
        "413":
          description: The request body is larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: request body must not exceed 65536 bytes
        "429":
          description: >-
            This API key sent more score requests than its rate limit allows.
            Nothing was saved. Wait for the number of seconds in `Retry-After`
            and send the same request again.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: too many score requests, retry later
        "500":
          description: >-
            The purchase could not be scored, for example because the database
            is unreachable. The response never contains the internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Check that the service is running
      description: >-
        Answers as long as the API process runs. It does not check the
        database; use `/ready` for that. Needs no API key.
      security: []
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok

  /ready:
    get:
      tags: [Health]
      operationId: ready
      summary: Check that the service can score purchases
      description: >-
        Answers `ready` when the API can reach its database, so purchases can
        be scored. Needs no API key.
      security: []
      responses:
        "200":
          description: The service can score purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ready
        "503":
          description: The database cannot be reached; score requests would fail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: unavailable

  /account-events:
    post:
      tags: [Account events]
      operationId: recordAccountEvent
      summary: Record a login or password reset
      description: |
        Saves a login or password reset that the game's account system
        reports for a player. The account takeover rules
        `recent_password_reset`, `new_device_login`, and `new_country_login`
        read these events, and the review case lists them. Game models
        trained with account events (from `lgbm-game-v8`) also take four
        inputs computed from them: the hours since the latest password reset,
        the hours since the first login from the purchase's device and from
        its IP country, and the distinct login devices in the last 24 hours.

        A rule or model input reads only events with an event time before
        the purchase's event time, so send each event as soon as it happens. After
        authentication and validation, a retry with the same event ID and
        matching fields returns the saved event with 200 without saving it
        again. Fields are compared after normal request normalization, with
        timestamps compared at PostgreSQL's microsecond precision. A valid
        request that reuses the ID with different fields returns 409.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEventRequest"
            examples:
              login:
                summary: A login with every field.
                value:
                  event_id: evt-20001
                  player_id: player-381
                  event_type: login
                  event_time: "2026-11-08T09:50:00Z"
                  device_id: device-77aa
                  ip_country: TR
              passwordReset:
                summary: A password reset with only the required fields.
                value:
                  event_id: evt-20000
                  player_id: player-381
                  event_type: password_reset
                  event_time: "2026-11-08T09:30:00Z"
      responses:
        "201":
          description: The event was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEvent"
        "200":
          description: A matching earlier request already saved this event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEvent"
        "400":
          description: >-
            The request is not valid. When the problem is about specific
            fields, `fields` names each one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidType:
                  summary: The event type is not known.
                  value:
                    error: invalid request
                    fields:
                      event_type: must be login or password_reset
                missingField:
                  summary: A required field is missing.
                  value:
                    error: invalid request
                    fields:
                      player_id: is required
                invalidCountry:
                  summary: The IP country is not a two-letter code.
                  value:
                    error: invalid request
                    fields:
                      ip_country: must be a two-letter country code
        "401":
          description: The `X-API-Key` header is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "409":
          description: This event ID belongs to a saved event with different fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: an account event with this event ID was already recorded
                fields:
                  event_id: is already recorded
        "413":
          description: The request body is larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The event could not be saved. The response never contains the internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The database is unavailable and nothing was saved, or recording
            took longer than the score time limit. Retry with the same event
            ID after the `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chargebacks:
    post:
      tags: [Chargebacks]
      operationId: recordChargeback
      summary: Record a chargeback reported by the processor
      description: |
        Webhook for the payment processor. A processor reports a chargeback
        days or weeks after the purchase, when the cardholder's bank receives
        the dispute. The service records it as a training label for the fraud
        model. Chargebacks never change a saved decision and are never read by
        scoring, model inputs, rules, or reviews.

        In this project the processor is mocked: `backend/cmd/mock-bank`
        sends chargebacks for simulator runs.

        The webhook is authenticated by its signature instead of an API key.
        The sender computes HMAC-SHA256 with the shared
        `CHARGEBACK_WEBHOOK_SECRET` over `<timestamp>.<raw body>`, where
        `<timestamp>` is the exact `X-Signature-Timestamp` value, and sends
        `X-Signature: sha256=<lowercase hex>`. The service compares the
        signature in constant time and rejects a timestamp more than 5 minutes
        from its clock, so a captured delivery cannot be replayed later. While
        `CHARGEBACK_WEBHOOK_SECRET` is empty, the endpoint returns 503.

        `chargeback_id` is the idempotency key. A repeated delivery with the
        same content returns the recorded chargeback with 200. The same ID with
        any different field returns 409. Times are compared at microsecond
        precision.

        Reason codes and how training labels use them:

        | `reason_code` | Meaning | Counts as fraud |
        |---|---|---|
        | `fraud_card_not_present` | The cardholder did not authorise an online purchase with their card details | Yes |
        | `fraud_card_absent_other` | Other card-absent fraud, for example a taken-over account with a saved card | Yes |
        | `not_recognised` | The cardholder does not recognise the purchase; often a relative or a forgotten purchase | No |
        | `product_not_received` | The cardholder paid but says the item never arrived | No |
        | `duplicate` | The cardholder says they were charged twice | No |
        | `other` | Any other dispute | No |
      parameters:
        - name: X-Signature
          in: header
          required: true
          description: '`sha256=` followed by the lowercase hex HMAC-SHA256 of `<timestamp>.<raw body>`.'
          schema:
            type: string
            pattern: '^sha256=[0-9a-f]{64}$'
          example: sha256=49f24e537407743fa4a0242bb63b94b9a47ee99cbbe071ccd8a22550ae411686
        - name: X-Signature-Timestamp
          in: header
          required: true
          description: Unix time in seconds when the delivery was signed, in plain decimal digits without a sign. Must be within 5 minutes of the service clock.
          schema:
            type: string
            pattern: '^[0-9]+$'
          example: "1762941600"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargebackRequest"
      responses:
        "202":
          description: The chargeback was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "200":
          description: The same chargeback was already recorded. The body is the recorded chargeback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "400":
          description: >-
            The body is not one valid JSON object, or a field is invalid. A
            chargeback must not exceed the purchase amount or be received
            before the purchase event time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid request
                fields:
                  received_at: must not be before the purchase event time
        "401":
          description: The signature or timestamp header is missing, malformed, wrong, or more than 5 minutes from the service clock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing, invalid or expired webhook signature
        "404":
          description: No purchase was scored with this transaction ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: no purchase was scored with this transaction ID
                fields:
                  transaction_id: is unknown
        "409":
          description: A chargeback with this ID was recorded with different content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: a chargeback with this ID was recorded with different content
                fields:
                  chargeback_id: is already recorded
        "413":
          description: The request body is larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `CHARGEBACK_WEBHOOK_SECRET` is not configured, or the database is
            unavailable and nothing was saved (with `Retry-After`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: the chargeback webhook is not configured

  /stats/quality:
    get:
      tags: [Stats]
      operationId: getQuality
      summary: Decision quality for one evaluation run
      description: |
        Aggregate quality of saved scoring decisions with finalized known answers.
        Review and block are flagged; allow is unflagged. Analyst decisions do not
        change these results. Sources never mix. No individual answers are returned.
        This whole-run report ignores dashboard periods. Reporting can operate with
        simulation controls disabled when evaluation access is configured.
      security: [{SessionAuth: []}]
      parameters:
        - name: source
          in: query
          schema: {type: string, enum: [simulator, ieee-cis], default: simulator}
        - name: run_id
          in: query
          required: true
          description: Exact run ID within the selected source.
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Labelled sample and coverage, including known empty console runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QualityReport'}
        '400':
          description: Invalid, duplicate or unsupported query parameters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {description: "The session is missing or invalid."}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '404': {description: No run is known under this source and ID.}
        '503': {description: Evaluation access is absent or temporarily unavailable.}

  /stats/quality/runs:
    get:
      tags: [Stats]
      operationId: listQualityRuns
      summary: List evaluation run IDs for one source
      description: |
        Includes finalized and pending runs; simulator results also include console
        runs without labels. CLI and imported runs are discoverable without enabling
        simulation controls. IDs are ordered ascending using database text ordering.
        Only aggregate run identities are exposed, never individual answers.
      security: [{SessionAuth: []}]
      parameters:
        - name: source
          in: query
          schema: {type: string, enum: [simulator, ieee-cis], default: simulator}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: after
          in: query
          description: Exclusive run ID cursor returned by the previous page.
          schema: {type: string}
      responses:
        '200':
          description: A bounded page; no runs returns an empty array.
          content:
            application/json:
              schema:
                type: object
                required: [source, run_ids]
                properties:
                  source: {type: string, enum: [simulator, ieee-cis]}
                  run_ids: {type: array, items: {type: string}}
                  next_cursor: {type: string, description: Absent after the final page.}
        '400': {description: "Invalid, duplicate or unsupported query parameters."}
        '401': {description: "The session is missing or invalid."}
        '403': {$ref: '#/components/responses/RoleNotAllowed'}
        '503': {description: Evaluation access is absent or temporarily unavailable.}

  /stats:
    get:
      tags: [Stats]
      operationId: getStats
      summary: Decision statistics
      description: |
        Counts decisions by outcome and time bucket, reports p95 scoring latency
        and blocked purchase value, lists the most fired rules, and shows what
        the fraud model changed.
        The review queue size is always the current one, whatever the period.
      security:
        - SessionAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: How far back to count. The default is `24h`.
          schema:
            type: string
            enum: ["15m", "1h", "24h", "7d", "all"]
            default: "24h"
      responses:
        "200":
          description: The statistics for the period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "400":
          description: The period is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid request
                fields:
                  period: must be one of 15m, 1h, 24h, 7d, all
        "401":
          description: >-
            The API key is missing or wrong. With an Authorization header, a missing or invalid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The statistics could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /stats/export:
    get:
      tags: [Stats]
      operationId: exportDecisions
      summary: Download the decisions of a period as CSV
      description: |
        Streams the decisions of the period as a CSV file, newest first, for
        reports and offline analysis. The file starts with a UTF-8 byte order
        mark so spreadsheet programs read it as UTF-8. Text cells that start
        with `=`, `+`, `-`, `@`, a tab or a carriage return get a leading `'`,
        so a spreadsheet does not run them as formulas.

        Columns: `decided_at`, `transaction_id`, `player_id`, `amount_usd`,
        `outcome`, `rule_score`, `fired_rules` (rule names separated by `;`),
        `model_score`, `model_version`, `ruleset_version`, `review` (`open`,
        `approved`, `rejected`, or empty when the purchase was not reviewed),
        `reviewed_by`, `reviewed_at`.

        A file holds at most 50,000 decisions. `X-Export-Truncated` is `true`
        when the period has more; choose a shorter period for the rest.
      security:
        - SessionAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: Which decisions to export. The default is `24h`.
          schema:
            type: string
            enum: ["15m", "1h", "24h", "7d", "all"]
            default: "24h"
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              description: The file name, for example `decisions-24h-20261114T1305Z.csv`.
              schema:
                type: string
            X-Export-Rows:
              description: How many decisions the file holds.
              schema:
                type: integer
            X-Export-Truncated:
              description: "`true` when the period has more decisions than the file holds."
              schema:
                type: boolean
          content:
            text/csv:
              schema:
                type: string
              example: |
                decided_at,transaction_id,player_id,amount_usd,outcome,rule_score,fired_rules,model_score,model_version,ruleset_version,review,reviewed_by,reviewed_at
                2026-11-14T13:04:00Z,order-10042,player-381,19.99,review,50,high_amount,0.6200,lgbm-game-v9,3,approved,reviewer-one,2026-11-14T13:10:00Z
        "400":
          description: The period is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The decisions could not be counted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /stats/pipeline/recent:
    get:
      tags: [Stats]
      operationId: getRecentPipeline
      summary: Recent decisions by pipeline path
      description: |
        Counts the decisions with a purchase ID above `after` by outcome, blocklist
        block and model effect, for the live scoring pipeline. A client sends the
        `next_after` of the last answer as `after` to count only what is new.
        Without `after`, nothing is counted and `next_after` is the current
        largest decision purchase ID, so a client starts from now instead of
        replaying history.
        At most the newest 5000 decisions above `after` are counted, so a client
        that was away skips ahead. The response holds counts only, never a purchase.
        A decision committed after a newer purchase ID was already counted can be
        missed, so these counts are for live visualisation only. The totals come
        from `GET /stats`.
      security:
        - SessionAuth: []
      parameters:
        - name: after
          in: query
          required: false
          description: Count only decisions with a purchase ID above this one.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: The counts since the cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentPipelineResponse"
        "400":
          description: The cursor is not a non-negative integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid request
                fields:
                  after: must be a non-negative integer
        "401":
          description: >-
            The API key is missing or wrong. With an Authorization header, a missing or invalid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The counts could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /blocklist:
    get:
      tags: [Blocklist]
      operationId: listBlocklist
      summary: List blocklist entries
      description: Returns all entries, the newest first.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: All entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlocklistEntry"
        "401":
          description: >-
            The API key is missing or wrong. With an Authorization header, a missing or invalid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The entries could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Blocklist]
      operationId: addBlocklistEntry
      summary: Add a blocklist entry
      description: |
        Blocks a card token, device ID, player ID or IP address. The entry
        applies to the next scored purchase. Values and reasons are trimmed.
        IP addresses are stored in canonical form, so `::ffff:203.0.113.9`
        is saved as `203.0.113.9`.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value, reason]
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum: [card, device, player, ip]
                value:
                  type: string
                  maxLength: 200
                  example: 203.0.113.9
                reason:
                  type: string
                  maxLength: 500
                  example: proxy used in card testing
      responses:
        "201":
          description: The saved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistEntry"
        "400":
          description: The entry is not valid. `fields` names each problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid request
                fields:
                  value: must be an IPv4 or IPv6 address
                  reason: is required
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid session
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "409":
          description: The same type and value are already on the blocklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: this value is already on the blocklist
                fields:
                  value: is already on the blocklist
        "413":
          description: The request body exceeds 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The entry could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/OperatorAccessUnavailable"

  /blocklist/{id}:
    delete:
      tags: [Blocklist]
      operationId: removeBlocklistEntry
      summary: Remove a blocklist entry
      description: The value is no longer blocked from the next scored purchase on.
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: The entry was removed.
        "400":
          description: The ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: the entry ID must be a positive integer
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid session
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No entry has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: no blocklist entry has this ID
        "500":
          description: The entry could not be removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/OperatorAccessUnavailable"

  /model:
    get:
      tags: [Reviews]
      operationId: getModelStatus
      summary: Read the loaded fraud model and its training metrics
      description: >-
        Returns the active ruleset's model mode and effective thresholds.
        Evaluation metrics describe the named dataset in the loaded model's
        training report. Model risk helps prioritize reviews.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: The current model status.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [loaded, version, mode, clear_below, flag_at, evaluation]
                properties:
                  loaded:
                    type: boolean
                  version:
                    type: string
                    nullable: true
                    description: Null when no model is loaded.
                  mode:
                    type: string
                    enum: ["off", shadow, assist]
                  clear_below:
                    type: number
                    nullable: true
                    description: Effective threshold for clearing a review in assist mode. Null when no model is loaded.
                  flag_at:
                    type: number
                    nullable: true
                    description: Effective threshold for flagging a purchase in assist mode. Null when no model is loaded.
                  evaluation:
                    type: object
                    nullable: true
                    description: Null when evaluation metrics are unavailable.
                    required: [dataset, roc_auc, pr_auc]
                    properties:
                      dataset: {type: string}
                      roc_auc: {type: number, minimum: 0, maximum: 1}
                      pr_auc: {type: number, minimum: 0, maximum: 1}
        "401":
          description: The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The active model settings could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: List purchases awaiting review
      description: >-
        Returns up to 100 purchases, highest score first. Ties go to the oldest
        queued purchase, then the lowest purchase ID. Model sorting puts
        missing scores last. Follow next_cursor with the same sort order or request a numbered page.
      security:
        - SessionAuth: []
      parameters:
        - in: query
          name: sort
          description: Score used to order the queue.
          schema:
            type: string
            enum: [rule_score, model_score]
            default: rule_score
        - in: query
          name: cursor
          description: Opaque next_cursor from a previous response. Omit for the first page.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: page
          description: >-
            Request a numbered page and the count for the current filter.
            Cannot be combined with cursor. A page beyond the end returns the last available page.
          schema:
            type: integer
            format: int64
            minimum: 1
        - in: query
          name: claimed
          description: >-
            `mine` lists only the purchases claimed by the signed-in account.
            Needs a session. Omit to list every purchase awaiting review.
          schema:
            type: string
            enum: [mine]
      responses:
        "200":
          description: A page of purchases awaiting review.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "400":
          description: >-
            The sort order, cursor, page, or claimed filter is invalid, the cursor
            belongs to a different sort order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The review queue could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}/claim:
    post:
      tags: [Reviews]
      operationId: claimReview
      summary: Claim a purchase awaiting review
      description: >-
        Gives the purchase to the signed-in reviewer or admin, so that only
        that account can decide it. Claiming a purchase you already hold
        returns the original claim with 200. Every account must hold its claim before deciding.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          description: Positive 64-bit purchase ID from the review queue, represented as a decimal string.
      responses:
        "201":
          description: The purchase is now claimed by you.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewClaim"
        "200":
          description: You already held the claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewClaim"
        "400":
          description: The purchase ID is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          description: The session role cannot use this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The scored purchase does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Another account holds the claim, the purchase has already been
            decided, or it was scored with a different outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The claim could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

    delete:
      tags: [Reviews]
      operationId: releaseReviewClaim
      summary: Release a claim back to the shared queue
      description: >-
        Removes the open claim on a purchase awaiting review, so that any
        reviewer can claim it. Only admins can release claims. A decided
        purchase keeps its claim as the record of who held it.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          description: Positive 64-bit purchase ID, represented as a decimal string.
      responses:
        "204":
          description: The claim was released.
        "400":
          description: The purchase ID is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: The purchase has no open claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The purchase has already been decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The claim could not be released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /admin/accounts:
    post:
      tags: [Admin]
      operationId: createAccount
      summary: Create a reviewer or admin account
      description: The username is saved in lowercase. Only admins can create accounts.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAccount"
      responses:
        "201":
          description: The account was created and can sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetails"
        "400":
          description: >-
            The body is not a single account object, or a field is invalid.
            fields names the invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "409":
          description: The username is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The body is larger than 1024 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The account could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

    get:
      tags: [Admin]
      operationId: listAccounts
      summary: List every account
      description: Lists every account, disabled ones included, ordered by username. Password hashes are never returned.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: The accounts.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountDetails"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The accounts could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /admin/accounts/{username}/disable:
    post:
      tags: [Admin]
      operationId: disableAccount
      summary: Disable an account and sign it out
      description: >-
        The account can no longer sign in, and all its sessions end at once.
        Its open claims stay until an admin releases them. Disabling an account
        that is already disabled returns it again. An admin cannot disable
        their own account.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: The username of the account. It is not case-sensitive.
      responses:
        "200":
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetails"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No account has the username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The username is your own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The account could not be disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /admin/assignments:
    get:
      tags: [Admin]
      operationId: listAssignments
      summary: See what each reviewer is working on
      description: >-
        Lists every active reviewer, and any other account that still holds an
        open claim, with its open claims and the number of purchases it has
        decided. Decisions are counted by username. Only admins can use it.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: The work of each reviewer, ordered by username.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignments"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The assignments could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/{purchase_id}/decision:
    post:
      tags: [Reviews]
      operationId: resolveReview
      summary: Approve or reject a purchase awaiting review
      description: >-
        A session must first claim the purchase with POST
        /reviews/{purchase_id}/claim. Every decision requires the signed-in account to hold the claim.
        A rejection can also blocklist the purchase's device, card and player
        in the same transaction.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          description: Positive 64-bit purchase ID from the review queue, represented as a decimal string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                block_device:
                  type: boolean
                  default: false
                  description: >-
                    Also blocklist the device of the purchase, in the same
                    transaction as the rejection. Only allowed with a reject
                    decision. Offer it only for a review that has a device_id. A
                    purchase without a device, or a device that is already
                    blocked, is rejected without a new entry. A decision
                    that conflicts with an earlier one saves nothing.
                block_card:
                  type: boolean
                  default: false
                  description: >-
                    Also blocklist the card token of the purchase, in the same
                    transaction as the rejection. Only allowed with a reject
                    decision. When the card is already blocked, the purchase
                    is rejected without a new entry. A decision that
                    conflicts with an earlier one saves nothing.
                block_player:
                  type: boolean
                  default: false
                  description: >-
                    Also blocklist the player ID of the purchase, in the same
                    transaction as the rejection. Only allowed with a reject
                    decision. When the player is already blocked, the
                    purchase is rejected without a new entry. A decision that
                    conflicts with an earlier one saves nothing.
      responses:
        "201":
          description: The analyst decision was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResolution"
        "400":
          description: The purchase ID or request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: The scored purchase does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The purchase has already been decided or was scored with a
            different outcome, or a session that does not hold the claim on
            the purchase tried to decide it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 1024 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The review decision could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/claims:
    post:
      tags: [Reviews]
      operationId: claimReviews
      summary: Claim several purchases awaiting review
      description: >-
        Claims each listed purchase for the signed-in reviewer or admin, one
        after another in request order, with the rules of POST
        /reviews/{purchase_id}/claim. Each purchase gets its own result, so
        the response is 200 even when some could not be claimed. An
        unexpected failure on one purchase gives it the status error, and the
        rest are still claimed.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchClaimRequest"
      responses:
        "200":
          description: A result for each purchase, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchClaimResults"
        "400":
          description: >-
            The body is not a single object with only purchase_ids, or the list
            is empty, has more than 50 IDs, repeats an ID, or has an ID that is
            not a positive decimal string without leading zeros. Nothing was
            claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            The session role cannot use the review endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/decisions:
    post:
      tags: [Reviews]
      operationId: resolveReviews
      summary: Approve or reject several purchases awaiting review
      description: >-
        Applies one decision to each listed purchase, one after another in
        request order, with the rules of POST /reviews/{purchase_id}/decision:
        the signed-in account decides only the purchases it has claimed. Each purchase is decided in its own
        transaction, so the batch is not atomic: a purchase that someone else
        decided meanwhile is reported as already_decided and does not undo
        the others. Each purchase still gets at most one decision. An
        unexpected failure on one purchase gives it the status error, and the
        rest are still decided.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchDecisionRequest"
      responses:
        "200":
          description: A result for each purchase, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDecisionResults"
        "400":
          description: >-
            The body is not a single batch decision object, the decision is
            not approve or reject, a block field is set with approve, or the
            list is empty, has more than 50 IDs, repeats an ID, or has an ID
            that is not a positive decimal string without leading zeros.
            Nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "413":
          description: The request body exceeds 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}:
    get:
      tags: [Reviews]
      operationId: getReviewCase
      summary: Get the evidence behind a purchase awaiting review
      description: >-
        Returns one purchase marked for review with its rule score, fired rules
        and points, the version of the ruleset that scored it, the model
        score when one was recorded, the player's recent purchases before this
        one, activity on the same device, the payment gateway's CVV, AVS,
        and 3-D Secure results when the score request sent them, the
        player's logins and password resets in the 30 days before the
        purchase, and the IP intelligence lookup made when the purchase was
        scored.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The purchase ID from the review queue.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: The review case.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCase"
        "400":
          description: The purchase ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No purchase under review has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The review case could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /purchases/search:
    get:
      tags: [Reviews]
      operationId: searchPurchases
      summary: Find purchases by transaction ID, player ID or card token
      description: >-
        Returns up to 20 purchases whose transaction ID, player ID or card
        token equals the query exactly, newest first, with their outcome and
        review state. Reviewers and admins can search.
      security:
        - SessionAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: The exact value to look for; spaces around it are ignored.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The matching purchases, possibly none.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      $ref: "#/components/schemas/PurchaseMatch"
        "400":
          description: The query is empty or longer than 200 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /purchases/{purchase_id}:
    get:
      tags: [Reviews]
      operationId: getPurchase
      summary: The evidence and decision of any purchase
      description: >-
        Returns the same evidence as a review case for a purchase with any
        outcome, with its outcome and, for a resolved review, the analyst's
        decision.
      security:
        - SessionAuth: []
      parameters:
        - name: purchase_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: The purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetails"
        "400":
          description: The purchase ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No purchase has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/{purchase_id}/resolved:
    get:
      tags: [Reviews]
      operationId: getResolvedReviewCase
      summary: Get the evidence and decision for a resolved review
      description: >-
        Returns the scoring evidence for a resolved review, together with
        the analyst's decision, ID, and resolution time.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The resolved purchase ID from the linked purchases list.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: The resolved review case.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedReviewCase"
        "400":
          description: The purchase ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No resolved review has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The review case could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}/network:
    get:
      tags: [Reviews]
      operationId: getReviewNetwork
      summary: Get the players and cards linked to a purchase awaiting review
      description: >-
        Returns the purchase's device (when it has one), card, and player, and
        for each the other players or cards that share it in purchases within
        30 days before or after the purchase. Each linked entity shows its
        purchases that share the value and its worst status. At most 30 are
        listed per value, worst status first, then by most purchases. Fraud
        labels are never read.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The purchase ID from the review queue.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: The linked players and cards.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNetwork"
        "400":
          description: The purchase ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No purchase under review has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The linked players and cards could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}/network/purchases:
    get:
      tags: [Reviews]
      operationId: getReviewNetworkPurchases
      summary: Get the purchases of a player or card linked to a purchase awaiting review
      description: >-
        Returns the purchases of one linked player or card that share an
        anchor of the purchase under review, within 30 days before or after
        it, newest first, at most 50. The anchor's own value is read from the
        purchase under review, so only the client names the linked value. A
        value the network does not link, such as an unknown player or the
        purchase's own player or card, returns an empty list. Fraud labels are
        never read.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The purchase ID from the review queue.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
        - in: query
          name: anchor
          required: true
          description: >-
            The anchor of the purchase under review that links the value: its
            device or card for a linked player, or its player for a linked card.
          schema:
            type: string
            enum: [device, card, player]
        - in: query
          name: value
          required: true
          description: >-
            The linked value from the network: a player ID for the device or
            card anchor, a card token for the player anchor.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: The purchases of the linked value. A device anchor of a purchase without a device returns an empty list.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedPurchases"
        "400":
          description: >-
            The purchase ID is not a positive integer, anchor or value is
            missing or repeated, anchor is not device, card, or player, or
            value is longer than 256 bytes or contains control characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No purchase under review has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The linked purchases could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}/network/reviews:
    get:
      tags: [Reviews]
      operationId: getLinkedReviews
      summary: Get the other purchases awaiting review linked to a purchase awaiting review
      description: >-
        Returns the other purchases awaiting review that share the device
        (when the purchase has one), card, or player of the purchase under
        review, within 30 days before or after it. The purchase itself is left
        out, and a purchase that shares several values is listed once. Items
        have the queue's shape and order, highest rule score first, at most
        50. Fraud labels are never read.
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The purchase ID from the review queue.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: The linked purchases awaiting review.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedReviews"
        "400":
          description: The purchase ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No purchase under review has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The linked purchases awaiting review could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /rulesets:
    get:
      tags: [Rulesets]
      operationId: listRulesets
      summary: List ruleset versions
      description: Returns all published ruleset versions, newest first, with their version number, optional note, and creation time.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: All ruleset versions.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RulesetSummary"
        "401":
          description: >-
            Missing or invalid API key. With an Authorization header, a missing or invalid session.
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The ruleset history could not be read.
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Rulesets]
      operationId: publishRuleset
      summary: Publish and activate a new ruleset version
      description: |
        Submit the complete configuration. Rules absent from `rules` are
        disabled in the new version. An optional `note` explains why the
        version was made and is saved with the version. Existing decisions
        retain their version.

        Without `model`, the new version keeps the model settings of the
        active version. Thresholds that are still missing are taken from the
        report of the loaded model; without a loaded model they stay null.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesetConfig"
      responses:
        "201":
          description: The new version was published and activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "400":
          description: Invalid configuration. Validation errors identify the fields to fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            The session is missing or invalid.
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "413":
          description: The request body exceeds 65536 bytes.
        "500":
          description: The ruleset could not be published.
        "503":
          $ref: "#/components/responses/OperatorAccessUnavailable"

  /rulesets/preview:
    post:
      tags: [Rulesets]
      operationId: previewRuleset
      summary: Preview how a draft ruleset would change recent decisions
      description: |
        Replays the newest 1,000 decisions with the draft, the same body as
        POST /rulesets, and returns the outcomes before and after. Nothing is
        saved and the active ruleset does not change.

        Each decision keeps the rules that fired when it was scored and its
        saved model score. The replay is exact for changed points, thresholds,
        switched-off rules and model settings: blocklist matches stay blocked,
        the draft's points of the fired rules are added, the draft's thresholds
        decide, and in assist mode the draft's model thresholds adjust the
        outcome. A decision is counted as `uncertain` when the draft switches on
        a rule that was off, changes a rule's own settings (such as its limit),
        or uses assist mode for a decision without a saved model score.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesetConfig"
      responses:
        "200":
          description: The impact of the draft on recent decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetPreview"
        "400":
          description: The draft is not a valid ruleset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /rulesets/active:
    get:
      tags: [Rulesets]
      operationId: getActiveRuleset
      summary: Read the active ruleset
      security:
        - SessionAuth: []
      responses:
        "200":
          description: The current version and its settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "401":
          description: >-
            Missing or invalid API key. With an Authorization header, a missing or invalid session.
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "500":
          description: The ruleset could not be read.
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /rulesets/{version}:
    get:
      tags: [Rulesets]
      operationId: getRuleset
      summary: Read a ruleset version
      security:
        - SessionAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: The requested ruleset version and its settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "400":
          description: The version is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            Missing or invalid API key. With an Authorization header, a missing or invalid session.
        "403":
          $ref: "#/components/responses/RoleNotAllowed"
        "404":
          description: No ruleset has this version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The ruleset could not be read.
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        The key from the `API_KEY` setting of the backend. Use a long random
        value outside local development.
    SessionAuth:
      type: http
      scheme: bearer
      description: >-
        The token returned by POST /auth/login. Only its SHA-256 hash is
        stored, and it expires 12 hours after sign-in. Reviewers can use the
        review endpoints and model status. Admins can also use every
        statistics, quality, ruleset, blocklist, and simulation endpoint. A
        request with an Authorization header is checked as a session, and any
        X-API-Key header on it is ignored. POST /score accepts only the
        service key.

  responses:
    RoleNotAllowed:
      description: >-
        The session is valid, but its account role cannot use this endpoint.
        Reviewers can use the review endpoints and model status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    SessionRequired:
      description: The Authorization header is missing, or the session is unknown, expired, ended, or belongs to a disabled account.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DatabaseUnavailable:
      description: >-
        The database cannot be reached right now. Nothing was changed; retry
        after the number of seconds in Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: the database is unavailable; retry later

    OperatorAccessUnavailable:
      description: >-
        The database is unavailable. When
        the database is unavailable, nothing was changed and Retry-After is set.
      headers:
        Retry-After:
          description: Seconds to wait before retrying; set only when the database is unavailable.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ReviewAccessUnavailable:
      description: >-
        The database is unavailable. When
        the database is unavailable, nothing was changed and Retry-After is set.
      headers:
        Retry-After:
          description: Seconds to wait before retrying; set only when the database is unavailable.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, example: alice}
        password: {type: string, minLength: 1, format: password}
    Account:
      type: object
      required: [username, role]
      properties:
        username: {type: string, description: Lowercase username., example: alice}
        role: {type: string, enum: [reviewer, admin]}
    Session:
      type: object
      required: [token, expires_at, account]
      properties:
        token: {type: string, description: Session token. It is returned only once.}
        expires_at: {type: string, format: date-time}
        account: {$ref: '#/components/schemas/Account'}
    SimulationSettings:
      type: object
      additionalProperties: false
      required: [request_id, mode]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        mode: {type: string, enum: [live, backfill]}
        seed: {type: integer, minimum: 0, maximum: 9007199254740991, default: 1}
        rate: {type: number, minimum: 1, maximum: 50, default: 5}
        count:
          type: integer
          minimum: 0
          maximum: 10000
          description: Backfill defaults to 500; live must be zero or omitted.
        scenarios:
          type: array
          minItems: 1
          uniqueItems: true
          description: Omit for all patterns. With normal selected, 10 percent of events start a selected special scenario. Without normal all events use selected special scenarios.
          items:
            type: string
            enum: [normal, card_testing, account_takeover, new_account_spend, traveler, new_phone, internet_cafe, burst_buyer, new_casual_player, returning_player, stolen_card, low_and_slow, expat, new_big_spender, family_card, session_shopper, slow_card_testing, quiet_takeover, device_farm]
    SimulationRun:
      type: object
      required: [id, settings, status, created_at, finished_at, sent, failed, allowed, reviewed, blocked, pending]
      properties:
        id: {type: string}
        settings: {$ref: '#/components/schemas/SimulationSettings'}
        status: {type: string, enum: [starting, running, stopping, completed, stopped, failed, interrupted]}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        sent: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
        allowed: {type: integer, format: int64, minimum: 0}
        reviewed: {type: integer, format: int64, minimum: 0}
        blocked: {type: integer, format: int64, minimum: 0}
        pending: {type: boolean, description: An in-flight outcome is not checkpointed. Can remain true after interruption if no saved decision is found.}
        error: {type: string}
    ReviewResolution:
      type: object
      required: [purchase_id, decision, analyst_id, resolved_at, device_blocked, card_blocked, player_blocked]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        decision:
          type: string
          enum: [approve, reject]
        analyst_id:
          type: string
          description: Username of the authenticated account.
        resolved_at:
          type: string
          format: date-time
          description: Time when the database recorded the decision, in UTC.
        device_blocked:
          type: boolean
          description: True when this rejection added the device of the purchase to the blocklist.
        card_blocked:
          type: boolean
          description: True when this rejection added the card token of the purchase to the blocklist.
        player_blocked:
          type: boolean
          description: True when this rejection added the player ID of the purchase to the blocklist.

    ReviewPage:
      type: object
      required: [items, next_cursor, model_enabled]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReviewItem"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page. Null for numbered pages or the last cursor page.
        pagination:
          type: object
          description: Present when page is requested. An empty queue is represented as page 1 of 1.
          required: [page, total_pages, total_items]
          properties:
            page: {type: integer, format: int64, minimum: 1}
            total_pages: {type: integer, format: int64, minimum: 1}
            total_items: {type: integer, format: int64, minimum: 0}
        model_enabled:
          type: boolean
          description: Whether the scoring service currently has a model loaded.

    ReviewItem:
      type: object
      required: [purchase_id, transaction_id, event_time, queued_at, amount_minor, player_id, device_id, rule_score, model_score, model_version, fired_rules, claimed_by, claimed_at]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        transaction_id:
          type: string
        event_time:
          type: string
          format: date-time
          description: The purchase time in UTC.
        queued_at:
          type: string
          format: date-time
          description: When the purchase entered the queue, in UTC.
        amount_minor:
          type: string
          description: The integer amount in minor units as a decimal string.
        player_id:
          type: string
        device_id:
          type: string
          nullable: true
          description: The device ID of the purchase. It is null when the purchase carried none.
          example: device-7
        rule_score:
          type: integer
          minimum: 0
        model_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        model_version:
          type: string
          nullable: true
          description: >-
            Version of the model that gave model_score. It is null when the
            purchase was scored without a model.
          example: lgbm-ieee-v5-combined
        fired_rules:
          type: array
          items:
            $ref: "#/components/schemas/FiredRule"
        claimed_by:
          type: string
          nullable: true
          description: Username holding the claim on the purchase, or null while it is unclaimed.
          example: alice
        claimed_at:
          type: string
          format: date-time
          nullable: true
          description: When the claim was made, in UTC, or null while the purchase is unclaimed.

    NewAccount:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          description: Saved in lowercase.
          example: alice
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: 12 to 72 bytes.
        role: {type: string, enum: [reviewer, admin]}

    AccountDetails:
      type: object
      required: [username, role, disabled, created_at]
      properties:
        username: {type: string, example: alice}
        role: {type: string, enum: [reviewer, admin]}
        disabled: {type: boolean}
        created_at:
          type: string
          format: date-time
          description: When the account was created, in UTC.

    Assignments:
      type: object
      required: [reviewers]
      properties:
        reviewers:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerWork"

    ReviewerWork:
      type: object
      required: [username, role, disabled, decided, open_claims]
      properties:
        username: {type: string, example: alice}
        role: {type: string, enum: [reviewer, admin]}
        disabled:
          type: boolean
          description: True for a disabled account that still holds open claims.
        decided:
          type: integer
          format: int64
          minimum: 0
          description: Purchases decided under this username, all time.
        open_claims:
          type: array
          description: Claimed purchases still awaiting a decision, oldest claim first.
          items:
            $ref: "#/components/schemas/OpenClaim"

    OpenClaim:
      type: object
      required: [purchase_id, amount_minor, rule_score, model_score, claimed_at]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        amount_minor:
          type: string
          description: The integer amount in minor units as a decimal string.
        rule_score:
          type: integer
          minimum: 0
        model_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        claimed_at:
          type: string
          format: date-time
          description: When the claim was made, in UTC.

    ReviewClaim:
      type: object
      required: [purchase_id, claimed_by, claimed_at]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        claimed_by:
          type: string
          example: alice
        claimed_at:
          type: string
          format: date-time
          description: When the claim was made, in UTC.

    ReviewCase:
      allOf:
        - $ref: "#/components/schemas/ReviewItem"
        - type: object
          required: [ruleset_version, player_purchases, device_activity, cvv_result, avs_result, three_ds_result, account_events, ip_intel, model_reasons]
          properties:
            card_velocity_evidence:
              $ref: "#/components/schemas/CardVelocityEvidence"
            ruleset_version:
              type: integer
              format: int32
              description: The ruleset version that scored the purchase.
              example: 2
            player_purchases:
              type: array
              maxItems: 5
              description: Up to 5 recent purchases by the same player before this one, newest first.
              items:
                $ref: "#/components/schemas/CasePlayerPurchase"
            device_activity:
              $ref: "#/components/schemas/CaseDeviceActivity"
            cvv_result:
              type: string
              nullable: true
              enum: [match, mismatch, not_checked, null]
              description: The CVV result sent with the purchase, or null when the score request did not send it.
            avs_result:
              type: string
              nullable: true
              enum: [match, partial, mismatch, not_checked, null]
              description: The AVS result sent with the purchase, or null when the score request did not send it.
            three_ds_result:
              type: string
              nullable: true
              enum: [authenticated, attempted, failed, not_enrolled, null]
              description: The 3-D Secure result sent with the purchase, or null when the score request did not send it.
            account_events:
              type: array
              maxItems: 20
              description: >-
                Up to 20 logins and password resets of the player in the 30
                days before this purchase, newest first. Events recorded after
                the purchase was decided are marked, because the rules could
                not have seen them.
              items:
                $ref: "#/components/schemas/CaseAccountEvent"
            ip_intel:
              $ref: "#/components/schemas/CaseIPIntel"
            model_reasons:
              type: array
              maxItems: 5
              description: >-
                The model inputs that moved this purchase's own model score the
                most, strongest first. Each tree splits its output among the
                features on the path the purchase took, so the effects and the
                model's base value add up to the score before it becomes a
                probability and before blending with the player's earlier
                scores. Empty when the purchase has no model score or was scored
                by a different model version than the one loaded now.
              items:
                $ref: "#/components/schemas/ModelReason"

    ModelReason:
      type: object
      required: [feature, value, effect]
      properties:
        feature:
          type: string
          description: The model feature name.
          example: card_uses_1h
        value:
          type: number
          format: double
          description: The feature's value for this purchase; -1 means the value was not known.
          example: 6
        effect:
          type: number
          format: double
          description: How much the feature raised (positive) or lowered (negative) the score, in log-odds.
          example: 0.81

    PurchaseMatch:
      type: object
      required: [purchase_id, transaction_id, player_id, amount_minor, event_time, outcome, review, matched_by]
      properties:
        purchase_id:
          type: string
          example: "55"
        transaction_id:
          type: string
        player_id:
          type: string
        amount_minor:
          type: string
          example: "72609"
        event_time:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [allow, review, block]
        review:
          type: string
          nullable: true
          enum: [open, approved, rejected, null]
          description: The review state, or null when the purchase was not sent to review.
        matched_by:
          type: string
          enum: [transaction, player, card]

    PurchaseDetails:
      allOf:
        - $ref: "#/components/schemas/ReviewCase"
        - type: object
          required: [outcome, resolution]
          properties:
            outcome:
              type: string
              enum: [allow, review, block]
            resolution:
              type: object
              nullable: true
              description: The analyst's decision, or null when the purchase was not reviewed or the review is still open.
              required: [decision, analyst_id, resolved_at]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                analyst_id:
                  type: string
                resolved_at:
                  type: string
                  format: date-time

    PreviewCounts:
      type: object
      required: [allow, review, block]
      properties:
        allow:
          type: integer
        review:
          type: integer
        block:
          type: integer

    RulesetPreview:
      type: object
      required: [decisions, before, after, changed, uncertain, uncertain_rules, missing_model_scores, changes]
      properties:
        decisions:
          type: integer
          description: How many recent decisions were replayed, at most 1,000.
        before:
          $ref: "#/components/schemas/PreviewCounts"
        after:
          $ref: "#/components/schemas/PreviewCounts"
        changed:
          type: integer
          description: Decisions whose outcome would change.
        uncertain:
          type: integer
          description: Decisions that cannot be replayed exactly.
        uncertain_rules:
          type: array
          description: Rules the draft switches on or whose settings it changes, so their firing cannot be replayed.
          items:
            type: string
        missing_model_scores:
          type: integer
          description: Decisions without a saved model score while the draft uses assist mode.
        changes:
          type: array
          maxItems: 50
          description: The newest changed decisions.
          items:
            type: object
            required: [purchase_id, transaction_id, decided_at, before, after, rule_score_before, rule_score_after, uncertain]
            properties:
              purchase_id:
                type: string
              transaction_id:
                type: string
              decided_at:
                type: string
                format: date-time
              before:
                type: string
                enum: [allow, review, block]
              after:
                type: string
                enum: [allow, review, block]
              rule_score_before:
                type: integer
              rule_score_after:
                type: integer
              uncertain:
                type: boolean

    CardVelocityEvidence:
      type: object
      description: Saved Card velocity evidence. Omitted when no observation was saved for this decision.
      required: [count, limit, window_start, window_end, records_available, context_truncated, purchases]
      properties:
        count:
          type: integer
          description: Number of matching purchases counted at scoring.
        limit:
          type: integer
          description: Minimum count that fired the rule in the saved ruleset.
        window_start:
          type: string
          format: date-time
          description: Exclusive start of the rule window in UTC.
        window_end:
          type: string
          format: date-time
          description: Inclusive end of the rule window in UTC.
        records_available:
          type: boolean
          description: Whether the complete set of contributor references has been verified.
        context_truncated:
          type: boolean
          description: Whether more than 20 investigation records matched the rule window.
        purchases:
          type: array
          maxItems: 70
          description: Up to 50 saved references and 20 additional investigation records, ordered by purchase time.
          items:
            type: object
            required: [transaction_id, event_time, amount_minor, contributed, recorded_after_decision]
            properties:
              transaction_id:
                type: string
              event_time:
                type: string
                format: date-time
              amount_minor:
                type: string
                description: Amount in USD minor units.
              contributed:
                type: boolean
                description: Verified as counted in the original rule evaluation.
              recorded_after_decision:
                type: boolean
                description: Investigation record whose saved receipt timestamp follows the decision timestamp.

    ResolvedReviewCase:
      allOf:
        - $ref: "#/components/schemas/ReviewCase"
        - type: object
          required: [resolution]
          properties:
            resolution:
              type: object
              required: [decision, analyst_id, resolved_at]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                analyst_id:
                  type: string
                  description: The username identity that made the decision.
                resolved_at:
                  type: string
                  format: date-time
                  description: When the review was decided, in UTC.

    CaseIPIntel:
      type: object
      nullable: true
      description: >-
        The IP intelligence lookup saved with the decision. Null when no lookup
        was made: IP_INTEL_PROVIDER is off, or the purchase carried no
        ip_address. It is a rule input and evidence. The fraud model sees only
        whether the network is hosting or anonymous, never the address.
      required: [provider, available, hosting, vpn, proxy, tor]
      properties:
        provider:
          type: string
          description: The provider that answered, such as `mock`.
          example: mock
        available:
          type: boolean
          description: >-
            False when the lookup failed or took longer than its 40 ms limit.
            The purchase was then scored as if the address were unknown, and
            the network flags are all false.
        hosting:
          type: boolean
          description: The address belongs to a hosting or data-centre network.
        vpn:
          type: boolean
        proxy:
          type: boolean
          description: The address is a public proxy.
        tor:
          type: boolean
          description: The address is a Tor exit.

    CasePlayerPurchase:
      type: object
      required: [transaction_id, event_time, amount_minor, outcome]
      properties:
        transaction_id:
          type: string
        event_time:
          type: string
          format: date-time
          description: The purchase time in UTC.
        amount_minor:
          type: string
          description: The integer amount in minor units as a decimal string.
        outcome:
          type: string
          enum: [allow, review, block]

    CaseAccountEvent:
      type: object
      required: [event_id, event_type, event_time, device_id, ip_country, received_at, recorded_after_decision]
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum: [login, password_reset]
        event_time:
          type: string
          format: date-time
          description: The event time in UTC.
        device_id:
          type: string
          nullable: true
        ip_country:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
          description: When the service recorded the event, in UTC.
        recorded_after_decision:
          type: boolean
          description: >-
            True when the service recorded the event after the purchase was
            decided, so the rules could not have seen it.

    CaseDeviceActivity:
      type: object
      nullable: true
      description: Activity on the same device up to this purchase, or null when the purchase carried no device_id.
      required: [purchases, distinct_cards, last_seen_at]
      properties:
        purchases:
          type: integer
          format: int64
          minimum: 1
        distinct_cards:
          type: integer
          format: int64
          minimum: 1
        last_seen_at:
          type: string
          format: date-time
          description: Latest purchase time on this device up to this purchase, in UTC.

    CaseNetwork:
      type: object
      required: [window_days, anchors]
      properties:
        window_days:
          type: integer
          format: int32
          description: Linked purchases are at most this many days before or after the purchase under review.
          example: 30
        anchors:
          type: array
          minItems: 2
          maxItems: 3
          description: The purchase's device, when it has one, then its card and player.
          items:
            $ref: "#/components/schemas/NetworkAnchor"

    NetworkAnchor:
      type: object
      required: [type, value, blocklisted, linked_total, linked]
      properties:
        type:
          type: string
          enum: [device, card, player]
          description: >-
            A device or card links to other players who used it, and the player links to other cards it used.
        value:
          type: string
          description: The device ID, card token, or player ID of the purchase under review.
        blocklisted:
          type: boolean
          description: Whether this value is on the blocklist.
        linked_total:
          type: integer
          format: int64
          minimum: 0
          description: The number of linked entities, including any left out of linked.
        linked:
          type: array
          maxItems: 30
          description: Linked entities, worst status first, then most purchases, then by value.
          items:
            $ref: "#/components/schemas/LinkedEntity"

    LinkedEntity:
      type: object
      required: [type, value, purchases, status]
      properties:
        type:
          type: string
          enum: [player, card]
        value:
          type: string
          description: The player ID or card token.
        purchases:
          type: integer
          format: int64
          minimum: 1
          description: Its purchases that share the anchor value within the window.
        status:
          type: string
          enum: [blocklisted, rejected, blocked, in_review, clear]
          description: >-
            The worst of: the value is on the blocklist, an analyst rejected one of the purchases, one was blocked, one
            awaits review, or none of these. Only the blocklist check covers every purchase; the other statuses come
            from the purchases that share the anchor value within the window.

    LinkedPurchases:
      type: object
      required: [anchor, value, window_days, total, purchases]
      properties:
        anchor:
          type: string
          enum: [device, card, player]
          description: The anchor of the purchase under review that links the value.
        value:
          type: string
          description: The linked player ID or card token.
        window_days:
          type: integer
          format: int32
          description: Listed purchases are at most this many days before or after the purchase under review.
          example: 30
        total:
          type: integer
          format: int64
          minimum: 0
          description: The number of matching purchases, including any left out of purchases.
        purchases:
          type: array
          maxItems: 50
          description: The matching purchases, newest first.
          items:
            $ref: "#/components/schemas/LinkedPurchase"

    LinkedPurchase:
      type: object
      required: [purchase_id, transaction_id, event_time, amount_minor, outcome, review_decision, claimed_by, awaiting_review]
      properties:
        purchase_id:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Decimal purchase ID, sent as a string to preserve 64-bit precision.
        transaction_id:
          type: string
        event_time:
          type: string
          format: date-time
          description: Purchase time in UTC.
        amount_minor:
          type: string
          pattern: "^[0-9]+$"
          description: Amount in minor currency units, sent as a string to preserve 64-bit precision.
        outcome:
          type: string
          enum: [allow, review, block]
        review_decision:
          type: string
          enum: [approve, reject]
          nullable: true
          description: The analyst's decision, or null when no analyst decided the purchase.
        claimed_by:
          type: string
          nullable: true
          description: The username holding the claim while the purchase awaits review, or null.
        awaiting_review:
          type: boolean
          description: Whether the purchase was scored for review and is not yet decided.

    LinkedReviews:
      type: object
      required: [window_days, total, items]
      properties:
        window_days:
          type: integer
          format: int32
          description: Listed purchases are at most this many days before or after the purchase under review.
          example: 30
        total:
          type: integer
          format: int64
          minimum: 0
          description: The number of matching purchases, including any left out of items.
        items:
          type: array
          maxItems: 50
          description: The matching purchases, highest rule score first, then oldest decision first.
          items:
            $ref: "#/components/schemas/ReviewItem"

    BatchPurchaseIDs:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      description: Distinct purchase IDs from the review queue, as decimal strings.
      items:
        type: string
        pattern: "^[1-9][0-9]*$"

    BatchClaimRequest:
      type: object
      additionalProperties: false
      required: [purchase_ids]
      properties:
        purchase_ids:
          $ref: "#/components/schemas/BatchPurchaseIDs"

    BatchClaimResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per requested purchase, in request order.
          items:
            $ref: "#/components/schemas/BatchClaimResult"

    BatchClaimResult:
      type: object
      required: [purchase_id, status, claimed_by, claimed_at]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        status:
          type: string
          enum: [claimed, already_yours, held_by_other, already_decided, not_found, not_review, error]
          description: >-
            claimed is a new claim, already_yours a claim you held before, and
            held_by_other a claim of another account. already_decided,
            not_found and not_review match the 409 and 404 answers of the
            single claim. error means the claim could not be saved; retry it.
        claimed_by:
          type: string
          nullable: true
          description: The account holding the claim for claimed, already_yours and held_by_other, otherwise null.
        claimed_at:
          type: string
          format: date-time
          nullable: true
          description: When that claim was made, in UTC, or null.

    BatchDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, purchase_ids]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        purchase_ids:
          $ref: "#/components/schemas/BatchPurchaseIDs"
        block_device:
          type: boolean
          default: false
          description: >-
            Also blocklist each purchase's own device, in the same transaction
            as its rejection. Only allowed with a reject decision. A purchase
            without a device, or a device that is already blocked, is rejected
            without a new entry.
        block_card:
          type: boolean
          default: false
          description: >-
            Also blocklist each purchase's own card token, in the same
            transaction as its rejection. Only allowed with a reject decision.
            A card that is already blocked gets no new entry.
        block_player:
          type: boolean
          default: false
          description: >-
            Also blocklist each purchase's own player ID, in the same
            transaction as its rejection. Only allowed with a reject decision.
            A player that is already blocked gets no new entry.

    BatchDecisionResults:
      type: object
      required: [decision, analyst_id, results]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        analyst_id:
          type: string
          description: The username of the signed-in account.
        results:
          type: array
          description: One result per requested purchase, in request order.
          items:
            $ref: "#/components/schemas/BatchDecisionResult"

    BatchDecisionResult:
      type: object
      required: [purchase_id, status, resolved_at, device_blocked, card_blocked, player_blocked]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        status:
          type: string
          enum: [saved, already_decided, not_claimed, not_found, not_review, error]
          description: >-
            saved is the decision of this request. already_decided,
            not_claimed, not_found and not_review match the 409 and 404
            answers of the single decision. error means the decision could
            not be saved; retry it.
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Time when the database recorded the decision, in UTC, for saved, otherwise null.
        device_blocked:
          type: boolean
          description: True when this rejection added the device of the purchase to the blocklist. A purchase decided earlier in the same batch may already have blocked a shared value.
        card_blocked:
          type: boolean
          description: True when this rejection added the card token of the purchase to the blocklist.
        player_blocked:
          type: boolean
          description: True when this rejection added the player ID of the purchase to the blocklist.

    RulesetSummary:
      type: object
      required: [version, note, created_at]
      properties:
        version:
          type: integer
          format: int32
          example: 2
        note:
          type: string
          description: Optional note saved when the version was published, or empty string when omitted.
          example: Lower review threshold for weekend promo
        created_at:
          type: string
          format: date-time
          description: When the version was published, in UTC.

    Ruleset:
      allOf:
        - $ref: "#/components/schemas/RulesetConfig"
        - type: object
          required: [version, note, created_at, model]
          properties:
            version:
              type: integer
              format: int32
              example: 2
            note:
              type: string
              example: Lower review threshold for weekend promo
            created_at:
              type: string
              format: date-time
              description: When the version was published, in UTC.

    RulesetConfig:
      type: object
      required: [review_threshold, block_threshold, rules]
      properties:
        review_threshold:
          type: integer
          format: int32
          minimum: 1
          example: 50
        block_threshold:
          type: integer
          format: int32
          minimum: 1
          description: Must be greater than `review_threshold`.
          example: 80
        note:
          type: string
          maxLength: 500
          description: Optional note explaining why this version was published. Trimmed before saving.
          example: Lower review threshold for weekend promo
        rules:
          type: object
          description: |
            Settings keyed by `high_amount`, `card_velocity`, `new_account`,
            `country_mismatch`, `device_card_count`, `new_device_spike`,
            `cvv_mismatch`, `avs_mismatch`, `three_ds_failed`,
            `recent_password_reset`, `new_device_login`,
            `new_country_login`, `datacenter_ip`, or `anonymous_ip`. An
            omitted rule is disabled. An empty object disables all weighted
            rules.
            Enabled rule weights must add up to at most 2147483647.
          additionalProperties:
            type: object
            required: [enabled, weight]
            properties:
              enabled:
                type: boolean
              weight:
                type: integer
                format: int32
                minimum: 0
              limit:
                type: integer
                format: int64
                minimum: 0
                description: |
                  Amount in minor units for `high_amount`, earlier purchases in
                  an hour for `card_velocity`, account age in hours for
                  `new_account`, or distinct cards on one device in 60 minutes
                  for `device_card_count`, or minimum trusted purchase count
                  for `new_device_spike`. Both count limits must be at least 1.
                  For `recent_password_reset`, `new_device_login`, and
                  `new_country_login` it is the window before the purchase in
                  hours, from 1 to 720. Required except for `country_mismatch`,
                  `cvv_mismatch`, `avs_mismatch`, `three_ds_failed`,
                  `datacenter_ip`, and `anonymous_ip`, which have no threshold;
                  a limit sent for them is saved but not used.
              window_days:
                type: integer
                format: int32
                minimum: 1
                maximum: 3650
                description: Trusted purchase lookback in days. Required only for `new_device_spike`.
              min_amount_minor:
                type: integer
                format: int64
                minimum: 1
                description: Minimum purchase amount in minor units. Required only for `new_device_spike`.
              amount_multiplier:
                type: integer
                format: int32
                minimum: 2
                description: Minimum multiple of the exact trusted average. Required only for `new_device_spike`.
          example:
            high_amount: { enabled: true, weight: 30, limit: 50000 }
            card_velocity: { enabled: true, weight: 40, limit: 5 }
            new_account: { enabled: true, weight: 20, limit: 24 }
            country_mismatch: { enabled: true, weight: 25 }
        model:
          $ref: "#/components/schemas/ModelSettings"

    ModelSettings:
      type: object
      description: |
        How the version uses the fraud model. Without a loaded model
        (MODEL_PATH is empty) the service scores with rules only, whatever the
        mode says. The model never blocks a purchase.
      required: [mode]
      properties:
        mode:
          type: string
          enum: ["off", shadow, assist]
          description: |
            `off` computes and saves no model score. `shadow` saves the model
            score but does not change the outcome. `assist` lets the model
            clear a review or send an allowed purchase to review. Model
            inputs are saved in every mode.
          example: assist
        clear_below:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            A purchase the rules send to review is allowed when its model
            score is below this value. Must be lower than `flag_at`, and the
            two are set together. Null in versions published before model
            settings existed; those use the loaded model's report.
          example: 0.391385
        flag_at:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            An allowed purchase goes to review when its model score is at or
            above this value. Null in versions published before model settings
            existed; those use the loaded model's report.
          example: 0.994001

    ScoreRequest:
      type: object
      description: >-
        A purchase to score. Fields that are not listed are rejected. Empty
        optional strings count as omitted.
      additionalProperties: false
      required:
        - transaction_id
        - event_time
        - amount_minor
        - player_id
        - card_token
      properties:
        transaction_id:
          type: string
          minLength: 1
          description: >-
            Unique ID of the purchase, chosen by the caller. Reuse this ID
            with the same fields to recover the saved decision after a timeout.
          example: txn-10042
        event_time:
          type: string
          format: date-time
          description: >-
            When the purchase happened, in RFC 3339 with a time zone. It is
            converted to UTC. It must not be more than 5 minutes after the
            server's current time; past times are allowed, so recorded
            traffic can be replayed.
          example: "2026-11-08T10:00:00Z"
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Amount in minor units, for example 1999 for 19.99. It must be a
            positive integer. Decimals and exponent forms such as 1e3 are
            rejected. Used by the high_amount rule.
          example: 1999
        player_id:
          type: string
          minLength: 1
          description: The player who made the purchase. Checked against the blocklist.
          example: player-381
        card_token:
          type: string
          minLength: 1
          description: >-
            Token that stands for the payment card, never the card number.
            Checked against the blocklist and used by the card_velocity rule.
          example: card-7f3a
        card_issuer:
          type: string
          description: Identifier of the card issuer.
          example: "9500"
        card_network:
          type: string
          description: >-
            Card network. The model knows visa, mastercard, american express,
            and discover.
          example: visa
        card_type:
          type: string
          description: >-
            Card type. The model knows debit, credit, debit or credit, and
            charge card.
          example: debit
        card_country:
          type: string
          description: >-
            Country code of the card. The country_mismatch rule compares it
            with ip_country, so both must use the same format, for example
            ISO 3166-1 alpha-2.
          example: AZ
        card_category:
          type: string
          description: Code of the card category.
          example: "226"
        product_code:
          type: string
          description: Code of the purchased product. The model knows W, H, C, S, and R.
          example: W
        billing_region:
          type: string
          description: Code of the billing address region.
          example: "299"
        billing_country:
          type: string
          description: Code of the billing address country.
          example: "87"
        billing_distance:
          type: number
          format: double
          minimum: 0
          description: Distance between the billing address and the other address of the purchase.
          example: 12.5
        email_domain:
          type: string
          description: Domain of the purchaser's email address, without the user name.
          example: gmail.com
        recipient_email_domain:
          type: string
          description: Domain of the recipient's email address, when the purchase is sent to someone else.
          example: outlook.com
        device_type:
          type: string
          description: Type of the device. The model knows desktop and mobile.
          example: mobile
        device_name:
          type: string
          description: Name or model of the device.
          example: SM-G991B
        device_id:
          type: string
          description: Unique ID of the device. Checked against the blocklist.
          example: device-55c1
        ip_address:
          type: string
          description: >-
            IPv4 or IPv6 address of the purchase. Checked against the
            blocklist and, when IP_INTEL_PROVIDER is set, looked up for the
            datacenter_ip and anonymous_ip rules. The address is never a model
            input; the kind of network from the lookup is.
          example: 203.0.113.9
        ip_country:
          type: string
          description: >-
            Country code of the IP address. Compared with card_country by the
            country_mismatch rule.
          example: TR
        account_created_at:
          type: string
          format: date-time
          description: >-
            When the player's account was created, in RFC 3339 with a time
            zone. It must not be after event_time. Used by the new_account
            rule and, as whole days, by the fraud model.
          example: "2026-11-08T09:00:00Z"
        client_os:
          type: string
          description: >-
            Operating system the client reports, for example "Windows 10" or
            "iOS 11.2.1". Used by the fraud model.
          example: Windows 10
        client_browser:
          type: string
          description: >-
            Browser or app the client reports, for example "chrome 63.0" or
            "mobile safari 11.0". Used by the fraud model.
          example: chrome 63.0
        screen_resolution:
          type: string
          description: >-
            Screen resolution as WIDTHxHEIGHT, for example "1920x1080". Used
            by the fraud model.
          example: 1920x1080
        cvv_result:
          type: string
          enum: [match, mismatch, not_checked]
          description: >-
            The payment gateway's check of the card security code during
            authorization. The cvv_mismatch rule fires on `mismatch`. Also an
            input of game models trained with it.
          example: match
        avs_result:
          type: string
          enum: [match, partial, mismatch, not_checked]
          description: >-
            The payment gateway's check of the billing address against the
            card issuer's records. The avs_mismatch rule fires on `mismatch`
            only; `partial` is common for genuine cardholders and adds no
            points. Also an input of game models trained with it.
          example: partial
        three_ds_result:
          type: string
          enum: [authenticated, attempted, failed, not_enrolled]
          description: >-
            The outcome of 3-D Secure cardholder authentication. The
            three_ds_failed rule fires on `failed`. Also an input of game
            models trained with it.
          example: authenticated

    ScoreResponse:
      type: object
      description: The decision for a scored purchase.
      required:
        - transaction_id
        - outcome
        - score
        - fired_rules
        - ruleset_version
        - model_score
        - model_version
      properties:
        transaction_id:
          type: string
          description: The transaction ID from the request.
          example: txn-10042
        outcome:
          type: string
          enum: [allow, review, block]
          description: >-
            `allow` lets the purchase through. `review` sends it to an
            analyst. `block` rejects it, because of a blocklist match or
            because the rule score reached the block threshold. When a fraud
            model is loaded and the ruleset's model mode is `assist`, a review
            with a model score below `clear_below` becomes `allow`, and an
            allow with a model score at or above `flag_at` becomes `review`.
            The model never blocks a purchase.
          example: allow
        score:
          type: integer
          minimum: 0
          description: Total points of the rules that fired. It is 0 for a blocklist match.
          example: 0
        fired_rules:
          type: array
          description: The rules that fired. The list is empty when none fired.
          items:
            $ref: "#/components/schemas/FiredRule"
        ruleset_version:
          type: integer
          description: Version of the ruleset that scored the purchase.
          example: 1
        model_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: >-
            Fraud risk from the model, from 0 to 1. With the default combined
            model it is the higher of two percentiles: where the purchase ranks
            among validation purchases for the main model and for the
            first-fraud model. It is null when the service runs without a
            model (MODEL_PATH is empty) or the ruleset's model mode is `off`.
          example: 0.0074
        model_version:
          type: string
          nullable: true
          description: >-
            Version of the model that gave model_score, such as
            lgbm-ieee-v5-combined. It is saved with the decision. It is null
            when the service runs without a model or the ruleset's model mode
            is `off`.
          example: lgbm-ieee-v5-combined

    FiredRule:
      type: object
      description: A rule that fired and the points it added.
      required:
        - name
        - points
        - message
      properties:
        name:
          type: string
          enum: [high_amount, card_velocity, new_account, country_mismatch, device_card_count, new_device_spike,
            cvv_mismatch, avs_mismatch, three_ds_failed, recent_password_reset, new_device_login,
            new_country_login, datacenter_ip, anonymous_ip, blocklist]
          description: >-
            Name of the rule. high_amount fires when the amount reaches its
            limit. card_velocity fires when the card has enough purchases in
            the last hour. new_account fires when the account is newer than
            its limit in hours. country_mismatch fires when the card country
            differs from the IP country. device_card_count fires when the
            device reaches the distinct-card limit in 60 minutes, including
            the current card. new_device_spike fires when a purchase on a
            device absent from the player's trusted history reaches the
            configured purchase count and both amount thresholds.
            cvv_mismatch, avs_mismatch, and three_ds_failed fire when the
            request reports a CVV `mismatch`, an AVS `mismatch`, or a `failed`
            3-D Secure authentication.
            recent_password_reset fires when the player reset their password
            within the window before the purchase. new_device_login fires when
            any login within the window was the player's first from a device
            that no earlier login and no earlier allowed or approved purchase
            used. new_country_login does the same for the IP country. The two
            login rules need an earlier login or trusted purchase with a device
            or country to compare with. datacenter_ip fires when the IP
            intelligence provider reports a hosting or data-centre address,
            and anonymous_ip when it reports a VPN, a public proxy, or a Tor
            exit; neither fires without a lookup or when the lookup failed.
            blocklist is the entry of a purchase
            blocked because its card, device, player or IP address is on the
            blocklist. It adds no points.
          example: card_velocity
        points:
          type: integer
          description: Points the rule added to the score.
          example: 40
        message:
          type: string
          description: >-
            A sentence that states the value that made the rule fire and its
            limit. For a blocklist entry it names the type of the matched
            entry, never its value. Decisions saved before messages existed
            return the rule name.
          example: Card used 5 times in 60 minutes (limit 5)

    QualityReport:
      type: object
      required: [source, run_id, generated_at, labelled_decisions, true_positives, false_positives, true_negatives, false_negatives, precision, recall, false_positive_rate, fraud_value_flagged_minor, fraud_value_allowed_minor, coverage]
      properties:
        source: {type: string, enum: [simulator, ieee-cis]}
        run_id: {type: string}
        generated_at: {type: string, format: date-time}
        labelled_decisions: {type: integer, format: int64, minimum: 0}
        true_positives: {type: integer, format: int64, minimum: 0, description: Fraudulent purchases sent to review or blocked.}
        false_positives: {type: integer, format: int64, minimum: 0, description: Legitimate purchases sent to review or blocked.}
        true_negatives: {type: integer, format: int64, minimum: 0, description: Legitimate purchases allowed.}
        false_negatives: {type: integer, format: int64, minimum: 0, description: Fraudulent purchases allowed.}
        precision:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: True positives divided by all flagged purchases. Null without flagged purchases.
        recall:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: True positives divided by fraudulent purchases. Null without fraudulent purchases.
        false_positive_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: False positives divided by legitimate purchases. Null without legitimate purchases.
        fraud_value_flagged_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Exact fraudulent purchase value sent to review or blocked, in minor units. This is not money recovered or prevented.
        fraud_value_allowed_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Exact fraudulent purchase value allowed, in minor units.
        coverage:
          type: object
          required: [pending, quarantined, scored_decisions, run_status]
          properties:
            pending: {type: integer, format: int64, minimum: 0, description: Unresolved intents excluded from metrics.}
            quarantined: {type: integer, format: int64, minimum: 0, description: Rejected or unverifiable intents excluded from metrics.}
            scored_decisions:
              type: integer
              format: int64
              nullable: true
              minimum: 0
              description: Recorded console progress. Null for CLI and imported runs whose expected total is unknown.
            run_status:
              type: string
              nullable: true
              enum: [starting, running, stopping, completed, stopped, failed, interrupted]
              description: Console lifecycle status, otherwise null. An active run or excluded data makes results partial.

    RecentPipelineResponse:
      type: object
      description: Decision counts since a purchase ID, for the live scoring pipeline.
      required: [after, next_after, outcomes, blocklist_blocks, model]
      properties:
        after:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: The `after` of the request. Null when the request had none.
        next_after:
          type: integer
          format: int64
          minimum: 0
          description: The largest purchase ID counted, or `after` when nothing was counted. Without `after`, the largest decision purchase ID, 0 when there are no decisions.
        outcomes:
          type: object
          required: [allow, review, block, total]
          properties:
            allow: { type: integer, minimum: 0 }
            review: { type: integer, minimum: 0 }
            block: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        blocklist_blocks:
          type: integer
          minimum: 0
          description: Blocked decisions that matched the blocklist. The rest of `outcomes.block` came from the rules.
        model:
          type: object
          required: [flagged, cleared]
          properties:
            flagged: { type: integer, minimum: 0, description: Purchases the rules allowed and the model sent to review. }
            cleared: { type: integer, minimum: 0, description: Purchases the rules sent to review and the model allowed. }

    StatsResponse:
      type: object
      description: Decision statistics for a period.
      required: [period, since, generated_at, outcomes, blocklist_blocks, top_rules, review_queue, model, p95_scoring_latency_us, blocked_value_minor, decision_series]
      properties:
        period:
          type: string
          enum: ["15m", "1h", "24h", "7d", "all"]
        since:
          type: string
          format: date-time
          description: Decisions made at or after this time are counted.
        generated_at:
          type: string
          format: date-time
          description: Exclusive upper bound for the decision statistics.
        outcomes:
          type: object
          required: [allow, review, block, total]
          properties:
            allow: { type: integer, minimum: 0 }
            review: { type: integer, minimum: 0 }
            block: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        blocklist_blocks:
          type: integer
          minimum: 0
          description: Blocked decisions that matched the blocklist. The rest of `outcomes.block` came from the rules.
        top_rules:
          type: array
          description: Up to 10 rules, the most often fired first.
          items:
            type: object
            required: [name, fired, points]
            properties:
              name: { type: string, example: high_amount }
              fired: { type: integer, minimum: 0, description: Decisions in which the rule fired. }
              points: { type: integer, minimum: 0, description: Points the rule added in total. }
        review_queue:
          type: integer
          minimum: 0
          description: Purchases still awaiting review, all time.
        model:
          type: object
          required: [scored, flagged, cleared]
          properties:
            scored: { type: integer, minimum: 0, description: Decisions with a model score. }
            flagged: { type: integer, minimum: 0, description: Purchases the rules allowed and the model sent to review. }
            cleared: { type: integer, minimum: 0, description: Purchases the rules sent to review and the model allowed. }
        p95_scoring_latency_us:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          description: Discrete 95th percentile of recorded scoring latencies in microseconds. Null when the period has no recorded latency samples.
          example: 1250
        blocked_value_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Exact sum of purchase amounts in minor units for scoring decisions with outcome block. The decimal string preserves large totals.
          example: "450000"
        decision_series:
          type: object
          required: [bucket_seconds, buckets]
          properties:
            bucket_seconds:
              type: integer
              minimum: 1
              description: Bucket width in seconds. The 15m, 1h, 24h, and 7d periods use 60, 300, 3600, and 21600 seconds respectively. The all-time period adapts to the history and returns at most 48 buckets.
            buckets:
              type: array
              description: UTC buckets in ascending order, including zero-count gaps. Counts cover only the part of each bucket inside the selected window. The array is empty when there are no decisions.
              items:
                type: object
                required: [start, allow, review, block]
                properties:
                  start: { type: string, format: date-time, description: UTC start of the bucket. }
                  allow: { type: integer, minimum: 0 }
                  review: { type: integer, minimum: 0 }
                  block: { type: integer, minimum: 0 }

    BlocklistEntry:
      type: object
      required: [id, type, value, reason, created_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [card, device, player, ip]
        value:
          type: string
          example: 203.0.113.9
        reason:
          type: string
          example: proxy used in card testing
        created_at:
          type: string
          format: date-time

    AccountEventRequest:
      type: object
      description: >-
        A login or password reset of a player. Fields that are not listed are
        rejected. Empty optional strings count as omitted.
      additionalProperties: false
      required: [event_id, player_id, event_type, event_time]
      properties:
        event_id:
          type: string
          minLength: 1
          description: >-
            Unique ID of the event, chosen by the caller, at most 256 bytes
            without control characters. Reuse this ID with the same fields to
            retry after a timeout.
          example: evt-20001
        player_id:
          type: string
          minLength: 1
          description: >-
            The player ID, as in the score request, at most 256 bytes without
            control characters.
          example: player-381
        event_type:
          type: string
          enum: [login, password_reset]
        event_time:
          type: string
          format: date-time
          description: >-
            When the event happened, in RFC 3339 with a time zone. It is
            converted to UTC. It must not be more than 5 minutes after the
            server's current time; past times are allowed, so recorded
            traffic can be replayed.
          example: "2026-11-08T09:50:00Z"
        device_id:
          type: string
          description: >-
            Device ID of the login or reset, as in the score request, at most
            256 bytes without control characters.
          example: device-77aa
        ip_country:
          type: string
          description: >-
            Two-letter country code of the IP address. It is saved in upper
            case and compared with the score request's IP country in upper
            case.
          example: TR

    AccountEvent:
      type: object
      description: A saved account event, normalized and in UTC.
      required: [event_id, player_id, event_type, event_time, device_id, ip_country]
      properties:
        event_id:
          type: string
        player_id:
          type: string
        event_type:
          type: string
          enum: [login, password_reset]
        event_time:
          type: string
          format: date-time
        device_id:
          type: string
          nullable: true
        ip_country:
          type: string
          nullable: true

    ChargebackRequest:
      type: object
      additionalProperties: false
      required: [chargeback_id, transaction_id, reason_code, amount_minor, received_at]
      properties:
        chargeback_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The processor's ID for the chargeback. Repeated deliveries use the same ID. Must not contain control characters.
          example: cb-4f1c2a9e0b7d3c51
        transaction_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The transaction ID of the scored purchase. Must not contain control characters.
          example: txn-10042
        reason_code:
          type: string
          enum: [fraud_card_not_present, fraud_card_absent_other, not_recognised, product_not_received, duplicate, other]
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Disputed amount in minor units, at most the purchase amount.
          example: 1999
        received_at:
          type: string
          format: date-time
          description: >-
            When the cardholder's bank received the dispute, RFC 3339. Not
            before the purchase event time and not more than 5 minutes in the
            future. Converted to UTC.
          example: "2026-12-03T09:15:00Z"
    Chargeback:
      type: object
      required: [chargeback_id, transaction_id, reason_code, amount_minor, received_at, recorded_at]
      properties:
        chargeback_id: {type: string, example: cb-4f1c2a9e0b7d3c51}
        transaction_id: {type: string, example: txn-10042}
        reason_code:
          type: string
          enum: [fraud_card_not_present, fraud_card_absent_other, not_recognised, product_not_received, duplicate, other]
        amount_minor: {type: integer, format: int64, example: 1999}
        received_at: {type: string, format: date-time, example: "2026-12-03T09:15:00Z"}
        recorded_at:
          type: string
          format: date-time
          description: When the service first recorded the chargeback, in UTC.
          example: "2026-12-03T09:15:02Z"

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]

    ErrorResponse:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          type: string
          description: What went wrong, in one sentence.
          example: invalid request
        fields:
          type: object
          description: >-
            Present when the error is about specific request fields. Maps each
            field name to what is wrong with it.
          additionalProperties:
            type: string
          example:
            amount_minor: must be a positive integer in minor units
