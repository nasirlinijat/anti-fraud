openapi: 3.0.3

info:
  title: Anti-Fraud API
  version: 0.1.0
  description: |
    Real-time fraud scoring for in-game purchases. Every purchase gets one of
    three outcomes: `allow`, `review`, or `block`.

    This file is written by hand and is the agreed format for the score
    request and response. The backend, the simulator, the frontend, and the
    conversion of the IEEE-CIS data all use these fields.

    Conventions:

    - Amounts are integers in minor units, never decimals.
    - Times are RFC 3339 and are converted to UTC. The response and the
      stored data use UTC.
    - Optional fields can be omitted. A rule that needs an omitted field does
      not fire.

servers:
  - url: http://localhost:8080
    description: Local development server.

tags:
  - name: Score
    description: Score a purchase.
  - name: Stats
    description: Decision statistics for the dashboard.
  - name: Blocklist
    description: Manage blocked cards, devices, players and IP addresses.
  - name: Reviews
    description: Browse purchases awaiting review.

  - name: Rulesets
    description: Read and publish scoring configuration.

paths:
  /score:
    post:
      tags: [Score]
      operationId: scorePurchase
      summary: Score a purchase
      description: |
        Scores a purchase, saves the purchase and its decision, and returns the
        outcome.

        1. If the card, player, device, or IP address is on the blocklist, the
           purchase is blocked before the rules run. The score is 0 and no
           rules fire.
        2. Otherwise the enabled rules of the active ruleset add points. A
           total at or above the block threshold is `block`, at or above the
           review threshold is `review`, and anything lower is `allow`.

        Purchases with the outcome `review` go to the review queue for an
        analyst. A transaction ID can be scored only once.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
            examples:
              minimal:
                summary: Only the required fields.
                value:
                  transaction_id: txn-10042
                  event_time: "2026-11-08T10:00:00Z"
                  amount_minor: 1999
                  player_id: player-381
                  card_token: card-7f3a
              full:
                summary: Every field.
                value:
                  transaction_id: txn-10043
                  event_time: "2026-11-08T14:00:00+04:00"
                  amount_minor: 60000
                  player_id: player-381
                  card_token: card-7f3a
                  card_issuer: "9500"
                  card_network: visa
                  card_type: debit
                  card_country: AZ
                  card_category: "226"
                  product_code: W
                  billing_region: "299"
                  billing_country: "87"
                  billing_distance: 12.5
                  email_domain: gmail.com
                  recipient_email_domain: outlook.com
                  device_type: mobile
                  device_name: SM-G991B
                  device_id: device-55c1
                  ip_address: 203.0.113.9
                  ip_country: TR
                  account_created_at: "2026-11-08T09:00:00Z"
                  client_os: Windows 10
                  client_browser: chrome 63.0
                  screen_resolution: 1920x1080
      responses:
        "200":
          description: The purchase was scored and saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
              examples:
                allow:
                  summary: No rule fired.
                  value:
                    transaction_id: txn-10042
                    outcome: allow
                    score: 0
                    fired_rules: []
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
                review:
                  summary: Rules added 60 points, which is above the review threshold of 50.
                  value:
                    transaction_id: txn-10044
                    outcome: review
                    score: 60
                    fired_rules:
                      - name: card_velocity
                        points: 40
                      - name: new_account
                        points: 20
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
                blockedByRules:
                  summary: Rules added 115 points, which is above the block threshold of 80.
                  value:
                    transaction_id: txn-10043
                    outcome: block
                    score: 115
                    fired_rules:
                      - name: high_amount
                        points: 30
                      - name: card_velocity
                        points: 40
                      - name: new_account
                        points: 20
                      - name: country_mismatch
                        points: 25
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
                blockedByBlocklist:
                  summary: A blocklist entry matched, so the rules did not run.
                  value:
                    transaction_id: txn-10045
                    outcome: block
                    score: 0
                    fired_rules: []
                    ruleset_version: 1
                    model_score: 0.0074
                    model_version: lgbm-ieee-v5-combined
        "400":
          description: >-
            The request is not valid. When the problem is about specific
            fields, `fields` names each one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidField:
                  summary: A field has a wrong value.
                  value:
                    error: invalid request
                    fields:
                      amount_minor: must be a positive integer in minor units
                missingField:
                  summary: A required field is missing.
                  value:
                    error: invalid request
                    fields:
                      player_id: is required
                unknownField:
                  summary: The body has a field that is not in the request.
                  value:
                    error: invalid request
                    fields:
                      amount: is not a known field
                badTime:
                  summary: A time is not RFC 3339.
                  value:
                    error: times must be RFC 3339, for example 2026-11-08T10:00:00Z
                badJson:
                  summary: The body is not valid JSON.
                  value:
                    error: request body is not valid JSON
        "401":
          description: The `X-API-Key` header is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "409":
          description: A purchase with this transaction ID was already scored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: a purchase with this transaction ID was already scored
                fields:
                  transaction_id: is already scored
        "413":
          description: The request body is larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: request body must not exceed 65536 bytes
        "500":
          description: >-
            The purchase could not be scored, for example because the database
            is unreachable. The response never contains the internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error

  /stats:
    get:
      tags: [Stats]
      operationId: getStats
      summary: Decision statistics
      description: |
        Counts the decisions made in a recent period by outcome, lists the
        rules that fired most often, and shows what the fraud model changed.
        The review queue size is always the current one, whatever the period.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: How far back to count. The default is `24h`.
          schema:
            type: string
            enum: ["15m", "1h", "24h", "7d", "all"]
            default: "24h"
      responses:
        "200":
          description: The statistics for the period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "400":
          description: The period is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid request
                fields:
                  period: must be one of 15m, 1h, 24h, 7d, all
        "401":
          description: The API key is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "500":
          description: The statistics could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error

  /blocklist:
    get:
      tags: [Blocklist]
      operationId: listBlocklist
      summary: List blocklist entries
      description: Returns all entries, the newest first.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: All entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlocklistEntry"
        "401":
          description: The API key is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "500":
          description: The entries could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error
    post:
      tags: [Blocklist]
      operationId: addBlocklistEntry
      summary: Add a blocklist entry
      description: |
        Blocks a card token, device ID, player ID or IP address. The entry
        applies to the next scored purchase. Values and reasons are trimmed.
        IP addresses are stored in canonical form, so `::ffff:203.0.113.9`
        is saved as `203.0.113.9`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value, reason]
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum: [card, device, player, ip]
                value:
                  type: string
                  maxLength: 200
                  example: 203.0.113.9
                reason:
                  type: string
                  maxLength: 500
                  example: proxy used in card testing
      responses:
        "201":
          description: The saved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistEntry"
        "400":
          description: The entry is not valid. `fields` names each problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid request
                fields:
                  value: must be an IPv4 or IPv6 address
                  reason: is required
        "401":
          description: The API key is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "409":
          description: The same type and value are already on the blocklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: this value is already on the blocklist
                fields:
                  value: is already on the blocklist
        "500":
          description: The entry could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error

  /blocklist/{id}:
    delete:
      tags: [Blocklist]
      operationId: removeBlocklistEntry
      summary: Remove a blocklist entry
      description: The value is no longer blocked from the next scored purchase on.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: The entry was removed.
        "400":
          description: The ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: the entry ID must be a positive integer
        "401":
          description: The API key is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing or invalid API key
        "404":
          description: No entry has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: no blocklist entry has this ID
        "500":
          description: The entry could not be removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal error

  /reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: List purchases awaiting review
      description: >-
        Returns up to 100 purchases, ordered by when they entered the review
        queue, oldest first. Follow next_cursor to reach the next page.
      security:
        - AnalystKeyAuth: []
      parameters:
        - in: query
          name: cursor
          description: Opaque next_cursor from a previous response. Omit for the first page.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: A page of purchases awaiting review.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "400":
          description: The cursor is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The X-API-Key header is missing or contains an invalid analyst key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The review queue could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}/decision:
    post:
      tags: [Reviews]
      operationId: resolveReview
      summary: Approve or reject a purchase awaiting review
      security:
        - AnalystKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          description: Positive 64-bit purchase ID from the review queue, represented as a decimal string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                block_device:
                  type: boolean
                  default: false
                  description: >-
                    Also blocklist the device of the purchase, in the same
                    transaction as the rejection. Only allowed with a reject
                    decision. Offer it only for a review that has a device_id. A
                    purchase without a device, or a device that is already
                    blocked, is rejected without a new entry. A decision
                    that conflicts with an earlier one saves nothing.
      responses:
        "201":
          description: The analyst decision was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResolution"
        "400":
          description: The purchase ID or request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The X-API-Key header is missing or contains an invalid analyst key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The scored purchase does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The purchase has already been decided or was scored with a different outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 1024 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The review decision could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /reviews/{purchase_id}:
    get:
      tags: [Reviews]
      operationId: getReviewCase
      summary: Get the evidence behind a purchase awaiting review
      description: >-
        Returns one purchase marked for review with its rule score, fired rules
        and points, the version of the ruleset that scored it, and the model
        score when one was recorded.
      security:
        - AnalystKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The purchase ID from the review queue.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: The review case.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCase"
        "400":
          description: The purchase ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The X-API-Key header is missing or contains an invalid analyst key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No purchase under review has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The review case could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ReviewAccessUnavailable"

  /rulesets/active:
    get:
      tags: [Rulesets]
      operationId: getActiveRuleset
      summary: Read the active ruleset
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: The current version and its settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "401":
          description: Missing or invalid API key.
        "500":
          description: The ruleset could not be read.

  /rulesets:
    post:
      tags: [Rulesets]
      operationId: publishRuleset
      summary: Publish and activate a new ruleset version
      description: |
        Submit the complete configuration. Rules absent from `rules` are
        disabled in the new version. Existing decisions retain their version.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesetConfig"
      responses:
        "201":
          description: The new version was published and activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "400":
          description: Invalid configuration. Validation errors identify the fields to fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
        "413":
          description: The request body exceeds 65536 bytes.
        "500":
          description: The ruleset could not be published.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        The key from the `API_KEY` setting of the backend. Use a long random
        value outside local development.
    AnalystKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: The individual key assigned to the analyst in REVIEW_ANALYST_KEYS.

  responses:
    ReviewAccessUnavailable:
      description: No analyst keys are configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ReviewResolution:
      type: object
      required: [purchase_id, decision, analyst_id, resolved_at, device_blocked]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        decision:
          type: string
          enum: [approve, reject]
        analyst_id:
          type: string
          description: Analyst ID resolved from the authenticated key.
        resolved_at:
          type: string
          format: date-time
          description: Time when the database recorded the decision, in UTC.
        device_blocked:
          type: boolean
          description: True when this rejection added the device of the purchase to the blocklist.

    ReviewPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReviewItem"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null if this is the last page.

    ReviewItem:
      type: object
      required: [purchase_id, transaction_id, event_time, queued_at, amount_minor, player_id, device_id, rule_score, model_score, model_version, fired_rules]
      properties:
        purchase_id:
          type: string
          description: The purchase ID as a decimal string.
        transaction_id:
          type: string
        event_time:
          type: string
          format: date-time
          description: The purchase time in UTC.
        queued_at:
          type: string
          format: date-time
          description: When the purchase entered the queue, in UTC.
        amount_minor:
          type: string
          description: The integer amount in minor units as a decimal string.
        player_id:
          type: string
        device_id:
          type: string
          nullable: true
          description: The device ID of the purchase. It is null when the purchase carried none.
          example: device-7
        rule_score:
          type: integer
          minimum: 0
        model_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        model_version:
          type: string
          nullable: true
          description: >-
            Version of the model that gave model_score. It is null when the
            purchase was scored without a model.
          example: lgbm-ieee-v5-combined
        fired_rules:
          type: array
          items:
            $ref: "#/components/schemas/FiredRule"

    ReviewCase:
      allOf:
        - $ref: "#/components/schemas/ReviewItem"
        - type: object
          required: [ruleset_version]
          properties:
            ruleset_version:
              type: integer
              format: int32
              description: The ruleset version that scored the purchase.
              example: 2

    Ruleset:
      allOf:
        - $ref: "#/components/schemas/RulesetConfig"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32
              example: 2

    RulesetConfig:
      type: object
      required: [review_threshold, block_threshold, rules]
      properties:
        review_threshold:
          type: integer
          format: int32
          minimum: 1
          example: 50
        block_threshold:
          type: integer
          format: int32
          minimum: 1
          description: Must be greater than `review_threshold`.
          example: 80
        rules:
          type: object
          description: |
            Settings keyed by `high_amount`, `card_velocity`, `new_account`, or
            `country_mismatch`. An empty object disables all weighted rules.
            Enabled rule weights must add up to at most 2147483647.
          additionalProperties:
            type: object
            required: [enabled, weight]
            properties:
              enabled:
                type: boolean
              weight:
                type: integer
                format: int32
                minimum: 0
              limit:
                type: integer
                format: int64
                minimum: 0
                description: |
                  Amount in minor units for `high_amount`, earlier purchases in
                  an hour for `card_velocity`, or account age in hours for
                  `new_account`. Required except for `country_mismatch`.
          example:
            high_amount: { enabled: true, weight: 30, limit: 50000 }
            card_velocity: { enabled: true, weight: 40, limit: 5 }
            new_account: { enabled: true, weight: 20, limit: 24 }
            country_mismatch: { enabled: true, weight: 25 }

    ScoreRequest:
      type: object
      description: >-
        A purchase to score. Fields that are not listed are rejected. Empty
        optional strings count as omitted.
      additionalProperties: false
      required:
        - transaction_id
        - event_time
        - amount_minor
        - player_id
        - card_token
      properties:
        transaction_id:
          type: string
          minLength: 1
          description: >-
            Unique ID of the purchase, chosen by the caller. Scoring the same
            ID twice returns 409.
          example: txn-10042
        event_time:
          type: string
          format: date-time
          description: >-
            When the purchase happened, in RFC 3339 with a time zone. It is
            converted to UTC. It must not be more than 5 minutes after the
            server's current time; past times are allowed, so recorded
            traffic can be replayed.
          example: "2026-11-08T10:00:00Z"
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Amount in minor units, for example 1999 for 19.99. It must be a
            positive integer. Decimals and exponent forms such as 1e3 are
            rejected. Used by the high_amount rule.
          example: 1999
        player_id:
          type: string
          minLength: 1
          description: The player who made the purchase. Checked against the blocklist.
          example: player-381
        card_token:
          type: string
          minLength: 1
          description: >-
            Token that stands for the payment card, never the card number.
            Checked against the blocklist and used by the card_velocity rule.
          example: card-7f3a
        card_issuer:
          type: string
          description: Identifier of the card issuer.
          example: "9500"
        card_network:
          type: string
          description: >-
            Card network. The model knows visa, mastercard, american express,
            and discover.
          example: visa
        card_type:
          type: string
          description: >-
            Card type. The model knows debit, credit, debit or credit, and
            charge card.
          example: debit
        card_country:
          type: string
          description: >-
            Country code of the card. The country_mismatch rule compares it
            with ip_country, so both must use the same format, for example
            ISO 3166-1 alpha-2.
          example: AZ
        card_category:
          type: string
          description: Code of the card category.
          example: "226"
        product_code:
          type: string
          description: Code of the purchased product. The model knows W, H, C, S, and R.
          example: W
        billing_region:
          type: string
          description: Code of the billing address region.
          example: "299"
        billing_country:
          type: string
          description: Code of the billing address country.
          example: "87"
        billing_distance:
          type: number
          format: double
          minimum: 0
          description: Distance between the billing address and the other address of the purchase.
          example: 12.5
        email_domain:
          type: string
          description: Domain of the purchaser's email address, without the user name.
          example: gmail.com
        recipient_email_domain:
          type: string
          description: Domain of the recipient's email address, when the purchase is sent to someone else.
          example: outlook.com
        device_type:
          type: string
          description: Type of the device. The model knows desktop and mobile.
          example: mobile
        device_name:
          type: string
          description: Name or model of the device.
          example: SM-G991B
        device_id:
          type: string
          description: Unique ID of the device. Checked against the blocklist.
          example: device-55c1
        ip_address:
          type: string
          description: >-
            IPv4 or IPv6 address of the purchase. Checked against the
            blocklist.
          example: 203.0.113.9
        ip_country:
          type: string
          description: >-
            Country code of the IP address. Compared with card_country by the
            country_mismatch rule.
          example: TR
        account_created_at:
          type: string
          format: date-time
          description: >-
            When the player's account was created, in RFC 3339 with a time
            zone. It must not be after event_time. Used by the new_account
            rule and, as whole days, by the fraud model.
          example: "2026-11-08T09:00:00Z"
        client_os:
          type: string
          description: >-
            Operating system the client reports, for example "Windows 10" or
            "iOS 11.2.1". Used by the fraud model.
          example: Windows 10
        client_browser:
          type: string
          description: >-
            Browser or app the client reports, for example "chrome 63.0" or
            "mobile safari 11.0". Used by the fraud model.
          example: chrome 63.0
        screen_resolution:
          type: string
          description: >-
            Screen resolution as WIDTHxHEIGHT, for example "1920x1080". Used
            by the fraud model.
          example: 1920x1080

    ScoreResponse:
      type: object
      description: The decision for a scored purchase.
      required:
        - transaction_id
        - outcome
        - score
        - fired_rules
        - ruleset_version
        - model_score
        - model_version
      properties:
        transaction_id:
          type: string
          description: The transaction ID from the request.
          example: txn-10042
        outcome:
          type: string
          enum: [allow, review, block]
          description: >-
            `allow` lets the purchase through. `review` sends it to an
            analyst. `block` rejects it, because of a blocklist match or
            because the rule score reached the block threshold. When a fraud
            model is loaded, a review with a model score below `clear_below`
            becomes `allow`, and an allow with a model score at or above
            `flag_at` becomes `review`. The model never blocks a purchase.
          example: allow
        score:
          type: integer
          minimum: 0
          description: Total points of the rules that fired. It is 0 for a blocklist match.
          example: 0
        fired_rules:
          type: array
          description: The rules that fired. The list is empty when none fired.
          items:
            $ref: "#/components/schemas/FiredRule"
        ruleset_version:
          type: integer
          description: Version of the ruleset that scored the purchase.
          example: 1
        model_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: >-
            Fraud risk from the model, from 0 to 1. With the default combined
            model it is the higher of two percentiles: where the purchase ranks
            among validation purchases for the main model and for the
            first-fraud model. It is null when the service runs without a
            model (MODEL_PATH is empty).
          example: 0.0074
        model_version:
          type: string
          nullable: true
          description: >-
            Version of the model that gave model_score, such as
            lgbm-ieee-v5-combined. It is saved with the decision. It is null
            when the service runs without a model.
          example: lgbm-ieee-v5-combined

    FiredRule:
      type: object
      description: A rule that fired and the points it added.
      required:
        - name
        - points
        - message
      properties:
        name:
          type: string
          enum: [high_amount, card_velocity, new_account, country_mismatch, blocklist]
          description: >-
            Name of the rule. high_amount fires when the amount reaches its
            limit. card_velocity fires when the card has enough purchases in
            the last hour. new_account fires when the account is newer than
            its limit in hours. country_mismatch fires when the card country
            differs from the IP country. blocklist is the entry of a purchase
            blocked because its card, device, player or IP address is on the
            blocklist. It adds no points.
          example: card_velocity
        points:
          type: integer
          description: Points the rule added to the score.
          example: 40
        message:
          type: string
          description: >-
            A sentence that states the value that made the rule fire and its
            limit. For a blocklist entry it names the type of the matched
            entry, never its value. Decisions saved before messages existed
            return the rule name.
          example: Card used 5 times in 60 minutes (limit 5)

    StatsResponse:
      type: object
      description: Decision statistics for a period.
      required: [period, since, generated_at, outcomes, top_rules, review_queue, model]
      properties:
        period:
          type: string
          enum: ["15m", "1h", "24h", "7d", "all"]
        since:
          type: string
          format: date-time
          description: Decisions made at or after this time are counted.
        generated_at:
          type: string
          format: date-time
        outcomes:
          type: object
          required: [allow, review, block, total]
          properties:
            allow: { type: integer, minimum: 0 }
            review: { type: integer, minimum: 0 }
            block: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        top_rules:
          type: array
          description: Up to 10 rules, the most often fired first.
          items:
            type: object
            required: [name, fired, points]
            properties:
              name: { type: string, example: high_amount }
              fired: { type: integer, minimum: 0, description: Decisions in which the rule fired. }
              points: { type: integer, minimum: 0, description: Points the rule added in total. }
        review_queue:
          type: integer
          minimum: 0
          description: Purchases with the outcome review, all time.
        model:
          type: object
          required: [scored, flagged, cleared]
          properties:
            scored: { type: integer, minimum: 0, description: Decisions with a model score. }
            flagged: { type: integer, minimum: 0, description: Purchases the rules allowed and the model sent to review. }
            cleared: { type: integer, minimum: 0, description: Purchases the rules sent to review and the model allowed. }

    BlocklistEntry:
      type: object
      required: [id, type, value, reason, created_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [card, device, player, ip]
        value:
          type: string
          example: 203.0.113.9
        reason:
          type: string
          example: proxy used in card testing
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          type: string
          description: What went wrong, in one sentence.
          example: invalid request
        fields:
          type: object
          description: >-
            Present when the error is about specific request fields. Maps each
            field name to what is wrong with it.
          additionalProperties:
            type: string
          example:
            amount_minor: must be a positive integer in minor units
