services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      MODEL_PATH: /models/${MODEL_FILE:-lgbm-ieee-v5-combined.json}

  frontend:
    restart: unless-stopped

  edge:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      CONSOLE_HOST: ${CONSOLE_HOST:?set CONSOLE_HOST in .env}
      API_HOST: ${API_HOST:?set API_HOST in .env}
      CONSOLE_USER: ${CONSOLE_USER:?set CONSOLE_USER in .env}
      CONSOLE_PASSWORD_HASH: ${CONSOLE_PASSWORD_HASH:?set CONSOLE_PASSWORD_HASH in .env}
      BACKEND_PORT: ${PORT:?set PORT in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
