{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "antifraud.secretName" . }}
  labels:
    {{- include "antifraud.labels" (dict "component" "secrets" "root" .) | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ required "secrets.apiKey is required (or set existingSecret)" .Values.secrets.apiKey | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (or set existingSecret)" .Values.secrets.postgresPassword | quote }}
  RUNTIME_DB_PASSWORD: {{ required "secrets.runtimeDbPassword is required (or set existingSecret)" .Values.secrets.runtimeDbPassword | quote }}
  LABELS_DB_PASSWORD: {{ .Values.secrets.labelsDbPassword | quote }}
  CHARGEBACK_WEBHOOK_SECRET: {{ .Values.secrets.chargebackWebhookSecret | quote }}
{{- end }}
