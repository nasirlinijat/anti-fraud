apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "antifraud.labels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  selector:
    {{- include "antifraud.selector" (dict "component" "frontend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "antifraud.labels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "antifraud.selector" (dict "component" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "antifraud.labels" (dict "component" "frontend" "root" .) | nindent 8 }}
        {{- with include "antifraud.datadogLabels" (dict "service" "anti-fraud-console" "version" (default .Values.images.tag .Values.images.frontend.tag) "root" .) }}{{ . | trim | nindent 8 }}{{- end }}
      annotations:
        {{- include "antifraud.checksum" . | nindent 8 }}
        {{- with include "antifraud.datadogLogs" (dict "container" "frontend" "source" "caddy" "service" "anti-fraud-console" "root" .) }}{{ . | trim | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "antifraud.image" (dict "component" "frontend" "root" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
            - name: API_KEY
              {{- include "antifraud.secretRef" (dict "key" "API_KEY" "root" .) | nindent 14 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
