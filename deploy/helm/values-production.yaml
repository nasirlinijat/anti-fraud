existingSecret: anti-fraud-secrets

postgres:
  storage: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 768Mi

backend:
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      memory: 512Mi

edge:
  service:
    type: LoadBalancer
  persistence:
    enabled: true

backup:
  enabled: true
  schedule: "0 3 * * *"
  keep: 7

datadog:
  enabled: true
  env: production
  tracing: true
