services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      PORT: ${PORT:?set PORT in .env}
      API_KEY: ${API_KEY:?set API_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      MODEL_PATH: /models/lgbm-ieee-v4.json
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT:?set PORT in .env}"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: [tools]
    volumes:
      - ./backend:/src
    working_dir: /src
    command: generate

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.31.0
    profiles: [tools]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8090}:8080"

volumes:
  db-data:
