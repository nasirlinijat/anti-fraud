services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    stop_grace_period: 30s
    build: ./backend
    environment:
      PORT: ${PORT:?set PORT in .env}
      LABELS_DATABASE_URL: postgres://antifraud_labels:${LABELS_DB_PASSWORD:-}@db:5432/${POSTGRES_DB}?sslmode=disable
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      API_KEY: ${API_KEY:?set API_KEY in .env}
      REVIEW_ANALYST_KEYS: ${REVIEW_ANALYST_KEYS:-}
      OPERATOR_API_KEYS: ${OPERATOR_API_KEYS:-}
      CHARGEBACK_WEBHOOK_SECRET: ${CHARGEBACK_WEBHOOK_SECRET:-}
      SCORE_RATE_LIMIT: ${SCORE_RATE_LIMIT:-}
      SCORE_RATE_BURST: ${SCORE_RATE_BURST:-}
      SCORE_TIMEOUT: ${SCORE_TIMEOUT:-}
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-}
      DATABASE_URL: postgres://antifraud_api:${RUNTIME_DB_PASSWORD:?set RUNTIME_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MODEL_PATH: /models/lgbm-game-v5.json
      IP_INTEL_PROVIDER: ${IP_INTEL_PROVIDER:-mock}
      IP_INTEL_MOCK_RANGES: ${IP_INTEL_MOCK_RANGES:-}
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT:?set PORT in .env}"
    depends_on:
      db-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    environment:
      BACKEND_PORT: ${PORT:?set PORT in .env}
      API_KEY: ${API_KEY:?set API_KEY in .env}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  db-permissions:
    image: postgres:18-alpine
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/runtime-role.sql"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      LABELS_DB_PASSWORD: ${LABELS_DB_PASSWORD:-}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?set RUNTIME_DB_PASSWORD in .env}
    volumes:
      - ./backend/runtime-role.sql:/runtime-role.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.31.0
    profiles: [tools]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8090}:8080"

volumes:
  db-data:
